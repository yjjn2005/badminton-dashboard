<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
  <title>🏸 배드민턴 조별 풀리그</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
  <style>
    :root{
      --bg:#060B18;--bg2:#0D1526;--bg3:#121D35;
      --card:rgba(255,255,255,0.05);--card2:rgba(255,255,255,0.09);
      --border:rgba(255,255,255,0.09);--border2:rgba(255,255,255,0.16);
      --gold:#D4AF37;--gl:#F0D060;--gd:#9A7D20;
      --grn:#10B981;--grd:#059669;
      --blue:#60A5FA;--red:#F87171;--purple:#A78BFA;
      --t1:#F1F5F9;--t2:#94A3B8;--t3:#475569;
    }
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
    body{font-family:'Noto Sans KR',-apple-system,sans-serif;background:var(--bg);color:var(--t1);min-height:100vh;overflow-x:hidden;}
    body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
      background:radial-gradient(ellipse at 15% 0%,rgba(212,175,55,.07) 0%,transparent 55%),
                 radial-gradient(ellipse at 85% 100%,rgba(16,185,129,.06) 0%,transparent 55%);}
    #root{position:relative;z-index:1;}
    ::-webkit-scrollbar{width:3px;height:3px;}
    ::-webkit-scrollbar-track{background:transparent;}
    ::-webkit-scrollbar-thumb{background:var(--gd);border-radius:3px;}
    .noscroll::-webkit-scrollbar{display:none;}

    /* header */
    .hdr{background:rgba(6,11,24,.9);border-bottom:1px solid rgba(212,175,55,.18);
         backdrop-filter:blur(20px);position:sticky;top:0;z-index:100;}
    .hdr-inner{max-width:900px;margin:0 auto;padding:0 16px;}
    .hdr-top{display:flex;align-items:center;justify-content:space-between;padding:12px 0 4px;}
    .logo{display:flex;align-items:center;gap:10px;}
    .logo-em{font-size:23px;filter:drop-shadow(0 0 8px rgba(212,175,55,.5));}
    .logo-txt{font-size:16px;font-weight:800;letter-spacing:-.5px;
      background:linear-gradient(90deg,var(--gl),var(--gold),var(--gd));
      background-size:200% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;
      animation:shimmer 3s linear infinite;}
    .logo-sub{font-size:10px;color:var(--t3);letter-spacing:.07em;margin-top:1px;}
    .live{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:700;color:var(--gold);}
    .live-dot{width:6px;height:6px;border-radius:50%;background:var(--grn);box-shadow:0 0 8px var(--grn);animation:pulse 2s infinite;}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
    @keyframes shimmer{0%{background-position:-200% center}100%{background-position:200% center}}
    @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    @keyframes spin{to{transform:rotate(360deg)}}

    /* nav */
    .nav{display:flex;overflow-x:auto;padding-bottom:1px;}
    .nav::-webkit-scrollbar{display:none;}
    .nb{display:flex;align-items:center;gap:5px;padding:10px 13px;font-size:12px;font-weight:600;
        color:var(--t3);border-bottom:2px solid transparent;
        background:transparent;border-left:none;border-right:none;border-top:none;
        cursor:pointer;white-space:nowrap;font-family:inherit;transition:all .2s;}
    .nb:hover{color:var(--t2);}
    .nb.on{color:var(--gold);border-bottom-color:var(--gold);}

    /* layout */
    .main{max-width:900px;margin:0 auto;padding:18px 16px 80px;}
    .fade{animation:fadeUp .32s ease;}
    .col{display:flex;flex-direction:column;}
    .row{display:flex;align-items:center;}
    .between{justify-content:space-between;}
    .wrap{flex-wrap:wrap;}
    .g6{gap:6px;} .g8{gap:8px;} .g10{gap:10px;} .g12{gap:12px;} .g14{gap:14px;} .g16{gap:16px;} .g20{gap:20px;}

    /* cards */
    .card{background:var(--card);border:1px solid var(--border);border-radius:14px;backdrop-filter:blur(10px);}
    .card-gold{background:linear-gradient(135deg,rgba(212,175,55,.1),rgba(212,175,55,.02));
               border:1px solid rgba(212,175,55,.3);border-radius:14px;}

    /* buttons */
    .btn{border:none;cursor:pointer;font-family:inherit;font-weight:700;border-radius:10px;
         display:inline-flex;align-items:center;gap:6px;transition:all .15s;}
    .btn-gold{background:linear-gradient(135deg,var(--gold),var(--gd));color:#1a1000;
              padding:10px 18px;font-size:13px;box-shadow:0 4px 14px rgba(212,175,55,.25);}
    .btn-gold:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(212,175,55,.4);}
    .btn-gold:disabled{opacity:.45;pointer-events:none;}
    .btn-grn{background:linear-gradient(135deg,var(--grn),var(--grd));color:#fff;
             padding:10px 18px;font-size:13px;box-shadow:0 4px 14px rgba(16,185,129,.25);}
    .btn-grn:hover{transform:translateY(-1px);}
    .btn-ghost{background:transparent;color:var(--t2);border:1px solid var(--border);
               padding:8px 14px;font-size:12px;}
    .btn-ghost:hover{background:var(--card2);color:var(--t1);}
    .btn-sm{padding:6px 12px;font-size:12px;border-radius:8px;}
    .btn-icon{background:transparent;border:none;color:var(--t3);cursor:pointer;padding:5px;border-radius:7px;transition:all .15s;display:flex;}
    .btn-icon:hover{background:rgba(248,113,113,.15);color:var(--red);}
    .btn-cam{background:linear-gradient(135deg,rgba(212,175,55,.18),rgba(212,175,55,.06));
             border:1px solid rgba(212,175,55,.4);color:var(--gold);
             padding:9px 16px;font-size:13px;font-weight:700;border-radius:10px;
             cursor:pointer;display:inline-flex;align-items:center;gap:7px;
             font-family:inherit;transition:all .15s;}
    .btn-cam:hover{background:linear-gradient(135deg,rgba(212,175,55,.28),rgba(212,175,55,.1));transform:translateY(-1px);}
    .btn-cam:disabled{opacity:.45;pointer-events:none;}
    .bscore{width:40px;height:40px;border-radius:10px;border:1px solid var(--border2);
            background:var(--card2);color:var(--t1);font-size:20px;font-weight:800;
            cursor:pointer;display:flex;align-items:center;justify-content:center;
            transition:all .1s;user-select:none;-webkit-user-select:none;font-family:inherit;}
    .bscore:active{transform:scale(.88);background:var(--gold);color:#1a1000;}

    /* input */
    .inp{background:rgba(255,255,255,.05);border:1px solid var(--border);
         border-radius:10px;padding:10px 13px;color:var(--t1);
         font-size:14px;font-family:inherit;outline:none;width:100%;transition:all .2s;}
    .inp:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(212,175,55,.1);}
    .inp::placeholder{color:var(--t3);}
    input[type=number]::-webkit-inner-spin-button{opacity:.4;}

    /* badges */
    .medal{display:inline-flex;align-items:center;justify-content:center;
           border-radius:50%;font-size:12px;font-weight:800;width:30px;height:30px;flex-shrink:0;}
    .m1{background:linear-gradient(135deg,#F0D060,#D4AF37);color:#1a1000;box-shadow:0 2px 10px rgba(212,175,55,.4);}
    .m2{background:linear-gradient(135deg,#E2E8F0,#94A3B8);color:#0f172a;}
    .m3{background:linear-gradient(135deg,#FCA97A,#B45309);color:#fff;}
    .mn{background:rgba(255,255,255,.07);color:var(--t3);font-size:11px;}
    .pill-done{background:rgba(16,185,129,.15);color:var(--grn);border:1px solid rgba(16,185,129,.3);border-radius:100px;padding:2px 10px;font-size:11px;font-weight:700;}
    .pill-off{background:rgba(71,85,105,.2);color:var(--t3);border:1px solid rgba(71,85,105,.3);border-radius:100px;padding:2px 10px;font-size:11px;}
    .pill-on{background:rgba(212,175,55,.15);color:var(--gold);border:1px solid rgba(212,175,55,.3);border-radius:100px;padding:2px 10px;font-size:11px;font-weight:700;}

    /* group tabs */
    .gtabs{display:flex;gap:6px;flex-wrap:wrap;}
    .gtab{padding:5px 13px;border-radius:100px;font-size:12px;font-weight:600;
          cursor:pointer;border:1px solid var(--border);background:transparent;
          color:var(--t3);transition:all .15s;font-family:inherit;}
    .gtab:hover{color:var(--t2);border-color:var(--border2);}
    .gtab.on{background:var(--gold);color:#1a1000;border-color:var(--gold);box-shadow:0 3px 10px rgba(212,175,55,.3);}
    .gtab.empty{opacity:.38;}

    /* score card */
    .mcard{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:15px;transition:all .15s;}
    .mcard.done{border-color:rgba(16,185,129,.22);background:rgba(16,185,129,.03);}
    .mteams{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin-top:4px;}
    .pname{font-size:14px;font-weight:700;line-height:1.3;}
    .pleft{text-align:right;} .pright{text-align:left;}
    .sctrl{display:flex;align-items:center;gap:5px;justify-content:center;}
    .sdisp{width:52px;height:44px;background:rgba(255,255,255,.06);
           border:1px solid var(--border2);border-radius:10px;
           display:flex;align-items:center;justify-content:center;
           font-size:22px;font-weight:800;color:var(--t1);}
    .sdisp.win{color:var(--gold);border-color:rgba(212,175,55,.4);background:rgba(212,175,55,.09);}
    .vs{font-size:11px;font-weight:800;color:var(--t3);text-align:center;min-width:28px;}
    .win-lbl{font-size:10px;font-weight:800;color:var(--gold);letter-spacing:.04em;}

    /* check ring */
    .cring{width:30px;height:30px;border-radius:50%;border:2px solid var(--t3);
           display:flex;align-items:center;justify-content:center;cursor:pointer;
           transition:all .15s;background:transparent;flex-shrink:0;}
    .cring.on{border-color:var(--grn);background:rgba(16,185,129,.15);color:var(--grn);}

    /* rank */
    .rrow{display:grid;grid-template-columns:36px 1fr 40px 40px 44px 44px 50px;
          align-items:center;padding:12px 14px;border-bottom:1px solid rgba(255,255,255,.04);gap:4px;}
    .rrow:last-child{border-bottom:none;}
    .rrow.top{background:rgba(212,175,55,.04);}
    .rv{text-align:center;font-size:13px;}
    @media(max-width:500px){
      .rrow{grid-template-columns:32px 1fr 36px 36px 50px;}
      .hide-xs{display:none;}
    }

    /* stat */
    .sbox{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:15px 17px;}
    .snum{font-size:30px;font-weight:800;letter-spacing:-1px;line-height:1;margin-top:7px;}
    .slbl{font-size:10px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.06em;}
    .ssub{font-size:12px;color:var(--t3);margin-top:4px;}
    .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
    @media(max-width:500px){.grid4{grid-template-columns:repeat(2,1fr);}}

    /* progress */
    .ptrack{background:rgba(255,255,255,.06);border-radius:100px;height:8px;overflow:hidden;}
    .pfill{height:100%;border-radius:100px;background:linear-gradient(90deg,var(--grd),var(--grn),#34D399);
           transition:width 1s cubic-bezier(.4,0,.2,1);box-shadow:0 0 10px rgba(16,185,129,.4);}

    /* notice */
    .notice{background:rgba(212,175,55,.08);border:1px solid rgba(212,175,55,.25);
            border-radius:12px;padding:13px 16px;font-size:13px;color:var(--t2);line-height:1.65;}
    .notice b{color:var(--gold);}
    .sec{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--t3);margin-bottom:9px;}

    /* podium */
    .podium{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
    .pc{border-radius:12px;padding:15px 10px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:5px;}
    .pc1{background:rgba(212,175,55,.12);border:1px solid rgba(212,175,55,.35);order:2;}
    .pc2{background:rgba(148,163,184,.07);border:1px solid rgba(148,163,184,.2);order:1;}
    .pc3{background:rgba(180,83,9,.07);border:1px solid rgba(180,83,9,.2);order:3;}

    /* spinner */
    .spin{animation:spin .7s linear infinite;display:inline-block;}

    /* toast */
    .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
           background:rgba(13,21,38,.97);border-radius:12px;padding:12px 18px;
           display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;
           z-index:999;backdrop-filter:blur(16px);min-width:240px;max-width:90vw;
           box-shadow:0 16px 50px rgba(0,0,0,.5);animation:fadeUp .25s ease;}
    .toast.ok{border:1px solid rgba(16,185,129,.4);}
    .toast.err{border:1px solid rgba(248,113,113,.4);}
    .toast.info{border:1px solid rgba(212,175,55,.35);}

    /* api key banner */
    .api-banner{background:rgba(248,113,113,.08);border:1px solid rgba(248,113,113,.3);
                border-radius:10px;padding:10px 14px;font-size:12px;color:#FCA5A5;
                display:flex;align-items:center;gap:8px;}
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const {useState,useEffect,useRef,useCallback} = React;
const genId = () => Math.random().toString(36).substr(2,9);

/* ── SVG icons ─────────────────────────────────────────── */
const SVG = ({d,s=18,c='currentColor'}) => (
  <svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke={c}
    strokeWidth="1.9" strokeLinecap="round" strokeLinejoin="round" style={{flexShrink:0}}>
    <path d={d}/>
  </svg>
);
const I = {
  trophy:   "M6 9H4.5a2.5 2.5 0 0 1 0-5H6m12 0h1.5a2.5 2.5 0 0 1 0 5H18M4 1h16v2a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4V1zm4 14a4 4 0 0 0 8 0M12 19v4m-4 0h8",
  users:    "M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2M9 3a4 4 0 1 1 0 8 4 4 0 0 1 0-8zm12 18v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75",
  calendar: "M8 2v4M16 2v4M3 10h18M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z",
  chart:    "M3 3v18h18M7 16l4-4 4 4 5-5",
  check:    "M20 6L9 17l-5-5",
  plus:     "M12 5v14M5 12h14",
  trash:    "M3 6h18M19 6l-1 14H6L5 6M10 11v6M14 11v6M9 6V4h6v2",
  camera:   "M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2zM12 17a4 4 0 1 0 0-8 4 4 0 0 0 0 8z",
  star:     "M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z",
  loader:   "M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83",
  key:      "M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4",
  warn:     "M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0zM12 9v4M12 17h.01",
};

/* ── Ranking calc (round-robin, individual) ─────────────── */
function calcRank(group, allMatches) {
  const gm = allMatches.filter(m => m.gid===group.id && m.played);
  let stats = group.players.map(p => ({...p, played:0, wins:0, losses:0, draws:0, pf:0, pa:0, diff:0}));
  gm.forEach(m => {
    const i1=stats.findIndex(p=>p.id===m.p1id), i2=stats.findIndex(p=>p.id===m.p2id);
    if(i1<0||i2<0) return;
    stats[i1].played++; stats[i2].played++;
    stats[i1].pf+=m.s1; stats[i1].pa+=m.s2;
    stats[i2].pf+=m.s2; stats[i2].pa+=m.s1;
    if(m.s1>m.s2){stats[i1].wins++;stats[i2].losses++;}
    else if(m.s2>m.s1){stats[i2].wins++;stats[i1].losses++;}
    else{stats[i1].draws++;stats[i2].draws++;}
  });
  stats.forEach(p => p.diff=p.pf-p.pa);
  return stats.sort((a,b) => {
    // 1) 승수 → 2) 득실차 → 3) 승자승 → 4) 연장자(나이 많은 순)
    if(b.wins!==a.wins) return b.wins-a.wins;
    if(b.diff!==a.diff) return b.diff-a.diff;
    const h=gm.find(m=>(m.p1id===a.id&&m.p2id===b.id)||(m.p1id===b.id&&m.p2id===a.id));
    if(h){const as=h.p1id===a.id?h.s1:h.s2,bs=h.p1id===b.id?h.s1:h.s2;if(as!==bs) return bs-as;}
    return b.age-a.age; // 연장자 우선
  });
}

function buildMatches(gid, players, existingMatches) {
  const rest = existingMatches.filter(m=>m.gid!==gid);
  const nm = [];
  for(let i=0;i<players.length;i++)
    for(let j=i+1;j<players.length;j++)
      nm.push({id:genId(),gid,p1id:players[i].id,p2id:players[j].id,
               p1n:players[i].name,p2n:players[j].name,s1:0,s2:0,played:false});
  return [...rest,...nm];
}

/* ── Toast ─────────────────────────────────────────────── */
function Toast({msg,type,onDone}) {
  useEffect(()=>{const t=setTimeout(onDone,2800);return()=>clearTimeout(t);},[]);
  const col={ok:'#10B981',err:'#F87171',info:'#D4AF37'}[type];
  const icon={ok:I.check,err:I.warn,info:I.star}[type];
  return(
    <div className={`toast ${type}`}>
      <SVG d={icon} s={15} c={col}/>
      <span style={{color:'#E2E8F0'}}>{msg}</span>
    </div>
  );
}

/* ── Medal ─────────────────────────────────────────────── */
function Medal({n}) {
  if(n===0) return <span className="medal m1">1</span>;
  if(n===1) return <span className="medal m2">2</span>;
  if(n===2) return <span className="medal m3">3</span>;
  return <span className="medal mn">{n+1}</span>;
}

/* ── Gemini OCR helper ──────────────────────────────────── */
async function geminiOCR(apiKey, b64, prompt, schema) {
  const res = await fetch(
    `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKey}`,
    {method:'POST', headers:{'Content-Type':'application/json'},
     body:JSON.stringify({
       contents:[{role:'user',parts:[{text:prompt},{inlineData:{mimeType:'image/jpeg',data:b64}}]}],
       generationConfig:{responseMimeType:'application/json',responseSchema:schema}
     })}
  );
  const data = await res.json();
  if(data.error) throw new Error(data.error.message);
  return JSON.parse(data.candidates[0].content.parts[0].text);
}

/* ═══════════════════════════════════════════════════════
   MAIN APP
═══════════════════════════════════════════════════════ */
function App() {
  const [groups] = useState(() =>
    Array.from({length:10},(_,i)=>({id:genId(),name:`${i+1}조`,players:[]}))
  );
  const [gState, setGState] = useState(() =>
    Array.from({length:10},(_,i)=>({id:null,players:[]})) // will sync below
  );
  // Proper init: keep groups stable, manage players separately
  const [playerMap, setPlayerMap] = useState(() => {
    const m={};
    Array.from({length:10},(_,i)=>{m[`g${i}`]=[];});
    return m;
  });
  const [groupList] = useState(() =>
    Array.from({length:10},(_,i)=>({id:`g${i}`,name:`${i+1}조`}))
  );
  const [players, setPlayers] = useState({}); // {gid:[{id,name,age},...]}
  const [matches, setMatches] = useState([]);
  const [tab, setTab] = useState('dashboard');
  const [toast, setToast] = useState(null);
  const [apiKey, setApiKey] = useState(()=>localStorage.getItem('bdm_api_key')||'');
  const [ocr, setOcr] = useState(false);

  const getPlayers = (gid) => players[gid]||[];
  const activeGroups = groupList.filter(g=>(players[g.id]||[]).length>=2);
  const allPlayers = groupList.reduce((s,g)=>s+(players[g.id]||[]).length,0);

  const showToast = (msg,type='info') => {
    setToast({msg,type});
    setTimeout(()=>setToast(null),3000);
  };

  const setGroupPlayers = (gid, ps) => {
    setPlayers(prev=>{
      const next={...prev,[gid]:ps};
      return next;
    });
    setMatches(prev=>buildMatches(gid,ps,prev));
  };

  // camera OCR — player registration
  const handlePlayerPhoto = async (gid, file) => {
    if(!apiKey){showToast('API 키를 먼저 입력하세요 (우측 상단 키 버튼)','err');return;}
    setOcr(true);
    try {
      const b64 = await fileToB64(file);
      const result = await geminiOCR(apiKey, b64,
        '이 사진에서 배드민턴 대회 참가 선수 명단을 추출해주세요. 선수 이름(성+이름 또는 닉네임)과 나이를 추출하세요. 나이가 없으면 0으로 입력하세요.',
        {type:'OBJECT',properties:{players:{type:'ARRAY',items:{type:'OBJECT',properties:{name:{type:'STRING'},age:{type:'NUMBER'}}}}}}
      );
      if(result.players&&result.players.length>0){
        const cur = players[gid]||[];
        const toAdd = result.players
          .filter(p=>p.name&&p.name.trim())
          .slice(0, 8-cur.length);
        const newPs=[...cur,...toAdd.map(p=>({id:genId(),name:p.name.trim(),age:p.age||0}))];
        setGroupPlayers(gid,newPs);
        showToast(`${toAdd.length}명 선수 자동 등록 완료!`,'ok');
      } else {
        showToast('선수 명단을 인식하지 못했습니다. 다시 시도해주세요.','err');
      }
    } catch(e){showToast('이미지 인식 실패: '+e.message,'err');}
    finally{setOcr(false);}
  };

  // camera OCR — score entry
  const handleScorePhoto = async (gid, file) => {
    if(!apiKey){showToast('API 키를 먼저 입력하세요','err');return;}
    setOcr(true);
    try {
      const b64 = await fileToB64(file);
      const result = await geminiOCR(apiKey, b64,
        '이 배드민턴 득점표/경기기록지 사진에서 각 경기의 두 선수 이름과 점수를 추출해주세요.',
        {type:'OBJECT',properties:{matches:{type:'ARRAY',items:{type:'OBJECT',properties:{
          p1name:{type:'STRING'},p2name:{type:'STRING'},s1:{type:'NUMBER'},s2:{type:'NUMBER'}}}}}}
      );
      if(result.matches&&result.matches.length>0){
        let cnt=0;
        setMatches(prev=>{
          const nm=[...prev];
          result.matches.forEach(rm=>{
            const idx=nm.findIndex(m=>m.gid===gid&&(
              (m.p1n.includes(rm.p1name)||rm.p1name.includes(m.p1n))&&
              (m.p2n.includes(rm.p2name)||rm.p2name.includes(m.p2n))
            ));
            if(idx>=0){nm[idx]={...nm[idx],s1:rm.s1||0,s2:rm.s2||0,played:true};cnt++;}
          });
          return nm;
        });
        showToast(`${cnt}경기 결과 자동 입력!`,'ok');
      } else {
        showToast('득점 기록을 인식하지 못했습니다','err');
      }
    } catch(e){showToast('이미지 인식 실패','err');}
    finally{setOcr(false);}
  };

  const fileToB64 = (file) => new Promise((res,rej)=>{
    const r=new FileReader();
    r.onloadend=()=>res(r.result.split(',')[1]);
    r.onerror=rej;
    r.readAsDataURL(file);
  });

  const tabs=[
    {id:'dashboard',icon:I.chart,label:'대시보드'},
    {id:'setup',icon:I.users,label:'선수 등록'},
    {id:'scores',icon:I.calendar,label:'점수 입력'},
    {id:'ranks',icon:I.trophy,label:'순위표'},
  ];

  return (
    <div>
      {/* Header */}
      <header className="hdr">
        <div className="hdr-inner">
          <div className="hdr-top">
            <div className="logo">
              <span className="logo-em">🏸</span>
              <div>
                <div className="logo-txt">배드민턴 조별 풀리그</div>
                <div className="logo-sub">ROUND-ROBIN TOURNAMENT</div>
              </div>
            </div>
            <div className="row g8">
              <ApiKeyBtn apiKey={apiKey} setApiKey={setApiKey}/>
              <div className="live"><div className="live-dot"/>LIVE</div>
            </div>
          </div>
          <div className="nav">
            {tabs.map(t=>(
              <button key={t.id} className={`nb${tab===t.id?' on':''}`} onClick={()=>setTab(t.id)}>
                <SVG d={t.icon} s={13}/>{t.label}
              </button>
            ))}
          </div>
        </div>
      </header>

      <div className="main fade" key={tab}>
        {tab==='dashboard' && <Dashboard groupList={groupList} players={players} matches={matches} activeGroups={activeGroups} allPlayers={allPlayers} setTab={setTab}/>}
        {tab==='setup'     && <Setup groupList={groupList} players={players} setGroupPlayers={setGroupPlayers} handlePlayerPhoto={handlePlayerPhoto} ocr={ocr} apiKey={apiKey} showToast={showToast}/>}
        {tab==='scores'    && <Scores activeGroups={activeGroups} players={players} matches={matches} setMatches={setMatches} handleScorePhoto={handleScorePhoto} ocr={ocr} apiKey={apiKey} showToast={showToast}/>}
        {tab==='ranks'     && <Ranks activeGroups={activeGroups} players={players} matches={matches}/>}
      </div>

      {toast && <Toast {...toast} onDone={()=>setToast(null)}/>}
      {ocr && (
        <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,.6)',zIndex:200,display:'flex',alignItems:'center',justifyContent:'center',backdropFilter:'blur(4px)'}}>
          <div style={{color:' var(--gold)',textAlign:'center',fontSize:15,fontWeight:700}}>
            <SVG d={I.loader} s={36} c="var(--gold)" className="spin"/><br/>
            <div style={{marginTop:12}}>AI 인식 중...</div>
          </div>
        </div>
      )}
    </div>
  );
}

/* ── API Key button ─────────────────────────────────────── */

  const [open,setOpen]=useState(false);
  const [val,setVal]=useState(apiKey);
  return(
    <div style={{position:'relative'}}>
      <button className="btn btn-ghost btn-sm" onClick={()=>setOpen(o=>!o)} style={{gap:5,padding:'6px 10px'}}>
        <SVG d={I.key} s={13} c={apiKey?'var(--gold)':'var(--t3)'}/>
        <span style={{fontSize:11,color:apiKey?'var(--gold)':'var(--t3)'}}>{apiKey?'KEY ✓':'API 키'}</span>
      </button>
      {open&&(
        <div style={{position:'absolute',top:'calc(100% + 6px)',right:0,zIndex:300,
          background:'#0D1526',border:'1px solid var(--border2)',borderRadius:12,padding:14,width:280,
          boxShadow:'0 16px 40px rgba(0,0,0,.6)'}}>
          <div style={{fontSize:12,color:'var(--t2)',marginBottom:8,fontWeight:600}}>Gemini API 키 (카메라 OCR용)</div>
          <div className="row g8">
            <input className="inp" style={{fontSize:12,padding:'8px 10px'}} placeholder="AIza..." value={val} onChange={e=>setVal(e.target.value)}/>
            <button className="btn btn-gold btn-sm" style={{flexShrink:0}} onClick={()=>{setApiKey(val);localStorage.setItem('bdm_api_key',val);setOpen(false);}}>저장</button>
          </div>
          <div style={{fontSize:11,color:'var(--t3)',marginTop:8}}>
            <a href="https://aistudio.google.com" target="_blank" style={{color:'var(--gold)'}}>aistudio.google.com</a>에서 무료 발급
          </div>
        </div>
      )}
    </div>
  );
}

/* ═══════════════════════════════════════════════════════
   1. DASHBOARD
═══════════════════════════════════════════════════════ */
function Dashboard({groupList,players,matches,activeGroups,allPlayers,setTab}) {
  const total=matches.length, done=matches.filter(m=>m.played).length;
  const pct=total===0?0:Math.round(done/total*100);
  return(
    <div className="col g16">
      <div className="notice">
        <b>📋 사용 안내</b><br/>
        <b>① 선수 등록</b> — 각 조에 선수 이름·나이 입력 또는 <b>명단 사진 촬영</b>으로 자동 등록<br/>
        <b>② 점수 입력</b> — 조장이 핸드폰에서 +/− 버튼 또는 <b>득점표 사진</b>으로 점수 입력<br/>
        <b>③ 순위표</b> — 조별 풀리그 결과 · 개인 1·2·3위 <b>자동 계산</b> (동점: 승자승→연장자)
      </div>

      <div className="grid4">
        {[
          {lbl:'활성 조',val:activeGroups.length,sub:'/ 10조',c:'var(--gold)'},
          {lbl:'참가 선수',val:allPlayers,sub:'명',c:'var(--grn)'},
          {lbl:'전체 경기',val:total,sub:'경기',c:'var(--blue)'},
          {lbl:'완료',val:done,sub:`${pct}%`,c:'var(--purple)'},
        ].map(s=>(
          <div key={s.lbl} className="sbox">
            <div className="slbl">{s.lbl}</div>
            <div className="snum" style={{color:s.c}}>{s.val}</div>
            <div className="ssub">{s.sub}</div>
          </div>
        ))}
      </div>

      {total>0&&(
        <div className="card" style={{padding:'18px 20px'}}>
          <div className="row between" style={{marginBottom:10}}>
            <div>
              <div style={{fontSize:14,fontWeight:700}}>대회 진행률</div>
              <div style={{fontSize:12,color:'var(--t3)',marginTop:2}}>{done}경기 완료 · {total-done}경기 남음</div>
            </div>
            <div style={{fontSize:28,fontWeight:800,color:'var(--grn)'}}>{pct}<span style={{fontSize:13,fontWeight:500}}>%</span></div>
          </div>
          <div className="ptrack"><div className="pfill" style={{width:`${pct}%`}}/></div>
        </div>
      )}

      <div className="card" style={{padding:'18px 20px'}}>
        <div className="row between" style={{marginBottom:14}}>
          <div className="row g8">
            <SVG d={I.trophy} s={18} c="var(--gold)"/>
            <span style={{fontWeight:700,fontSize:15}}>현재 조별 선두 선수</span>
          </div>
          <button className="btn btn-ghost btn-sm" onClick={()=>setTab('ranks')}>전체 순위 →</button>
        </div>
        {activeGroups.length===0?(
          <div style={{textAlign:'center',color:'var(--t3)',padding:'18px 0',fontSize:13}}>
            선수 등록 후 경기를 시작하면 여기에 표시됩니다
          </div>
        ):(
          <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(175px,1fr))',gap:10}}>
            {activeGroups.map(g=>{
              const gPlayers=players[g.id]||[];
              const grp={id:g.id,name:g.name,players:gPlayers};
              const rank=calcRank(grp,matches);
              const leader=rank[0];
              return(
                <div key={g.id} className="card-gold" style={{padding:'13px 15px'}}>
                  <div style={{fontSize:10,fontWeight:700,color:'var(--gold)',letterSpacing:'.1em',marginBottom:5}}>{g.name}</div>
                  {leader?(
                    <>
                      <div style={{fontSize:14,fontWeight:700}}>{leader.name}</div>
                      <div className="row g10" style={{marginTop:6}}>
                        <span style={{fontSize:12,color:'var(--t3)'}}>승 <b style={{color:'var(--blue)'}}>{leader.wins}</b></span>
                        <span style={{fontSize:12,color:'var(--t3)'}}>패 <b style={{color:'var(--red)'}}>{leader.losses}</b></span>
                        <span style={{fontSize:12,color:'var(--t3)'}}>득실 <b style={{color:leader.diff>=0?'var(--grn)':'var(--red)'}}>{leader.diff>0?'+':''}{leader.diff}</b></span>
                      </div>
                    </>
                  ):<div style={{fontSize:12,color:'var(--t3)',marginTop:3}}>경기 결과 없음</div>}
                </div>
              );
            })}
          </div>
        )}
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════════════════
   2. PLAYER SETUP
═══════════════════════════════════════════════════════ */
function Setup({groupList,players,setGroupPlayers,handlePlayerPhoto,ocr,apiKey,showToast}) {
  const [selGid,setSelGid]=useState(groupList[0].id);
  const [name,setName]=useState('');
  const [age,setAge]=useState('');
  const camRef=useRef();

  const sel=groupList.find(g=>g.id===selGid);
  const ps=players[selGid]||[];

  const addPlayer = () => {
    if(!name.trim()) return;
    if(ps.length>=8){showToast('조당 최대 8명까지 가능합니다','err');return;}
    setGroupPlayers(selGid,[...ps,{id:genId(),name:name.trim(),age:Number(age)||0}]);
    setName(''); setAge('');
    showToast(`${sel.name}에 선수 추가 완료`,'ok');
  };

  const delPlayer = (pid) => {
    setGroupPlayers(selGid,ps.filter(p=>p.id!==pid));
  };

  const totalMatches = (n) => n*(n-1)/2;

  return(
    <div className="col g16">
      {!apiKey&&(
        <div className="api-banner">
          <SVG d={I.warn} s={15} c="#FCA5A5"/>
          카메라 자동 인식을 사용하려면 우측 상단 <b style={{color:'#FCA5A5'}}>API 키</b> 버튼을 눌러 Gemini API 키를 입력하세요
        </div>
      )}

      {/* group select */}
      <div>
        <div className="sec">조 선택 (1조~10조 · 2명 이상이면 자동 활성화)</div>
        <div className="gtabs">
          {groupList.map(g=>{
            const n=(players[g.id]||[]).length;
            return(
              <button key={g.id} className={`gtab${selGid===g.id?' on':''}${n===0?' empty':''}`}
                onClick={()=>setSelGid(g.id)}>
                {g.name}{n>0?` (${n})`:''}
              </button>
            );
          })}
        </div>
      </div>

      {sel&&(
        <div className="card" style={{padding:20}}>
          <div className="row between" style={{marginBottom:16}}>
            <div>
              <div style={{fontSize:18,fontWeight:800}}>{sel.name}</div>
              <div style={{fontSize:12,color:'var(--t3)',marginTop:3}}>
                {ps.length===0?'등록된 선수 없음 (비활성)':
                 ps.length===1?'선수 1명 — 2명 이상 필요':
                 `선수 ${ps.length}명 · 총 ${totalMatches(ps.length)}경기 풀리그`}
              </div>
            </div>
            <div style={{fontSize:24,fontWeight:800,color:'var(--gold)'}}>
              {ps.length}<span style={{fontSize:12,color:'var(--t3)',fontWeight:400}}>/8</span>
            </div>
          </div>

          {/* camera button */}
          <div style={{marginBottom:16}}>
            <input type="file" accept="image/*" capture="environment" ref={camRef} style={{display:'none'}}
              onChange={e=>{const f=e.target.files[0];if(f)handlePlayerPhoto(selGid,f);e.target.value='';}}/>
            <button className="btn-cam" onClick={()=>camRef.current?.click()} disabled={ocr}>
              <SVG d={I.camera} s={16}/>
              📷 선수 명단 사진으로 자동 등록
            </button>
            <span style={{fontSize:11,color:'var(--t3)',marginLeft:10}}>명단표·출전표 촬영 → AI 자동 입력</span>
          </div>

          {/* player list */}
          {ps.length>0&&(
            <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(150px,1fr))',gap:8,marginBottom:16}}>
              {ps.map((p,i)=>(
                <div key={p.id} style={{background:'var(--card2)',border:'1px solid var(--border)',borderRadius:10,
                  padding:'11px 13px',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                  <div>
                    <div className="row g6">
                      <span style={{fontSize:11,fontWeight:800,color:'var(--gold)'}}>{i+1}</span>
                      <span style={{fontSize:13,fontWeight:700}}>{p.name}</span>
                    </div>
                    {p.age>0&&<div style={{fontSize:11,color:'var(--t3)',marginTop:2}}>나이 {p.age}세</div>}
                  </div>
                  <button className="btn-icon" onClick={()=>delPlayer(p.id)}><SVG d={I.trash} s={14}/></button>
                </div>
              ))}
            </div>
          )}

          {/* manual add */}
          <div style={{background:'rgba(255,255,255,.03)',border:'1px solid var(--border)',borderRadius:10,padding:13}}>
            <div className="sec" style={{marginBottom:8}}>✏️ 직접 입력</div>
            <div className="col g8">
              <input className="inp" placeholder="선수 이름" value={name}
                onChange={e=>setName(e.target.value)}
                onKeyDown={e=>e.key==='Enter'&&addPlayer()}/>
              <div className="row g8">
                <input className="inp" type="number" placeholder="나이 (동점 시 연장자 우선)"
                  value={age} onChange={e=>setAge(e.target.value)}
                  onKeyDown={e=>e.key==='Enter'&&addPlayer()} style={{flex:1}}/>
                <button className="btn btn-grn" onClick={addPlayer}>
                  <SVG d={I.plus} s={15}/>추가
                </button>
              </div>
            </div>
          </div>
        </div>
      )}

      {/* summary */}
      <div className="card" style={{padding:16}}>
        <div className="sec" style={{marginBottom:10}}>전체 조 현황</div>
        <div className="col" style={{gap:5}}>
          {groupList.map(g=>{
            const n=(players[g.id]||[]).length;
            return(
              <div key={g.id} className="row between" style={{padding:'7px 0',borderBottom:'1px solid rgba(255,255,255,.04)'}}>
                <span style={{fontSize:13,fontWeight:600,color:n>=2?'var(--t1)':'var(--t3)'}}>{g.name}</span>
                {n===0?<span className="pill-off">비활성</span>:
                 n===1?<span className="pill-off">{n}명 (최소 2명)</span>:
                 <span className="pill-on">{n}명 · {n*(n-1)/2}경기</span>}
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════════════════
   3. SCORE INPUT
═══════════════════════════════════════════════════════ */
function Scores({activeGroups,players,matches,setMatches,handleScorePhoto,ocr,apiKey,showToast}) {
  const [selGid,setSelGid]=useState(activeGroups[0]?.id||null);
  const camRef=useRef();
  useEffect(()=>{if(!selGid&&activeGroups.length>0)setSelGid(activeGroups[0].id);},[activeGroups]);

  const gm=matches.filter(m=>m.gid===selGid);
  const done=gm.filter(m=>m.played).length;

  const adj=(mid,field,delta)=>setMatches(prev=>prev.map(m=>{
    if(m.id!==mid) return m;
    return {...m,[field]:Math.max(0,(m[field]||0)+delta),played:true};
  }));

  const toggle=(mid)=>setMatches(prev=>prev.map(m=>m.id===mid?{...m,played:!m.played}:m));

  if(activeGroups.length===0) return(
    <div className="card" style={{padding:32,textAlign:'center',color:'var(--t3)'}}>
      선수 등록 탭에서 먼저 각 조에 선수를 추가해주세요
    </div>
  );

  return(
    <div className="col g14">
      {/* group tabs */}
      <div>
        <div className="sec">조 선택</div>
        <div className="gtabs">
          {activeGroups.map(g=>{
            const total=matches.filter(m=>m.gid===g.id).length;
            const d=matches.filter(m=>m.gid===g.id&&m.played).length;
            return(
              <button key={g.id} className={`gtab${selGid===g.id?' on':''}`} onClick={()=>setSelGid(g.id)}>
                {g.name}{d>0?` ${d}/${total}`:''}
              </button>
            );
          })}
        </div>
      </div>

      {/* header + camera */}
      <div className="card-gold" style={{padding:'14px 16px'}}>
        <div className="row between wrap g8">
          <div>
            <div style={{fontSize:14,fontWeight:700,marginBottom:2}}>📝 점수 입력</div>
            <div style={{fontSize:12,color:'var(--t3)'}}>+/− 버튼으로 수동 입력 또는 득점표 사진 촬영</div>
          </div>
          <div className="row g8">
            <input type="file" accept="image/*" capture="environment" ref={camRef} style={{display:'none'}}
              onChange={e=>{const f=e.target.files[0];if(f&&selGid)handleScorePhoto(selGid,f);e.target.value='';}}/>
            <button className="btn-cam btn-sm" onClick={()=>camRef.current?.click()} disabled={ocr||!selGid}>
              <SVG d={I.camera} s={14}/>득점표 사진
            </button>
          </div>
        </div>
      </div>

      {/* progress */}
      {gm.length>0&&(
        <div className="row between">
          <span style={{fontSize:12,color:'var(--t3)'}}>{done}/{gm.length} 경기 완료</span>
          {done===gm.length&&done>0&&<span className="pill-done">✅ 조 완료</span>}
        </div>
      )}

      {/* match cards */}
      {gm.length===0?(
        <div className="card" style={{padding:28,textAlign:'center',color:'var(--t3)'}}>이 조에 경기가 없습니다</div>
      ):gm.map(m=>{
        const w1=m.played&&m.s1>m.s2, w2=m.played&&m.s2>m.s1;
        return(
          <div key={m.id} className={`mcard${m.played?' done':''}`}>
            <div className="row between">
              <span style={{fontSize:11,color:'var(--t3)',fontWeight:600}}>
                {m.played?(m.s1===m.s2?'무승부':'완료'):'대기'}
              </span>
              <button className={`cring${m.played?' on':''}`} onClick={()=>toggle(m.id)}>
                {m.played&&<SVG d={I.check} s={13} c="var(--grn)"/>}
              </button>
            </div>
            <div className="mteams">
              <div className="pleft">
                {w1&&<div className="win-lbl">🏆 WIN</div>}
                <div className="pname" style={{color:w1?'var(--t1)':w2?'var(--t3)':'var(--t2)'}}>{m.p1n}</div>
              </div>
              <div className="col" style={{alignItems:'center',gap:5}}>
                <div className="row g6">
                  <div className="sctrl">
                    <button className="bscore" onPointerDown={()=>adj(m.id,'s1',-1)}>−</button>
                    <div className={`sdisp${w1?' win':''}`}>{m.s1}</div>
                    <button className="bscore" onPointerDown={()=>adj(m.id,'s1',1)}>+</button>
                  </div>
                  <div className="vs">VS</div>
                  <div className="sctrl">
                    <button className="bscore" onPointerDown={()=>adj(m.id,'s2',-1)}>−</button>
                    <div className={`sdisp${w2?' win':''}`}>{m.s2}</div>
                    <button className="bscore" onPointerDown={()=>adj(m.id,'s2',1)}>+</button>
                  </div>
                </div>
              </div>
              <div className="pright">
                {w2&&<div className="win-lbl">🏆 WIN</div>}
                <div className="pname" style={{color:w2?'var(--t1)':w1?'var(--t3)':'var(--t2)'}}>{m.p2n}</div>
              </div>
            </div>
          </div>
        );
      })}
    </div>
  );
}

/* ═══════════════════════════════════════════════════════
   4. RANKINGS
═══════════════════════════════════════════════════════ */
function Ranks({activeGroups,players,matches}) {
  const [selGid,setSelGid]=useState(activeGroups[0]?.id||null);
  const [showAll,setShowAll]=useState(false);
  useEffect(()=>{if(!selGid&&activeGroups.length>0)setSelGid(activeGroups[0].id);},[activeGroups]);

  if(activeGroups.length===0) return(
    <div className="card" style={{padding:32,textAlign:'center',color:'var(--t3)'}}>
      선수 등록 후 경기 결과를 입력하면 순위가 자동 계산됩니다
    </div>
  );

  const grp = activeGroups.find(g=>g.id===selGid);
  const grpObj = grp ? {id:grp.id,name:grp.name,players:players[grp.id]||[]} : null;
  const rank = grpObj ? calcRank(grpObj,matches) : [];

  return(
    <div className="col g14">
      {/* header */}
      <div className="card-gold" style={{padding:'18px 20px'}}>
        <div className="row g10" style={{marginBottom:6}}>
          <SVG d={I.trophy} s={20} c="var(--gold)"/>
          <div style={{fontSize:19,fontWeight:800,
            background:'linear-gradient(90deg,var(--gl),var(--gold),var(--gd))',
            backgroundSize:'200% auto',WebkitBackgroundClip:'text',WebkitTextFillColor:'transparent',
            animation:'shimmer 3s linear infinite'}}>
            조별 개인 순위
          </div>
        </div>
        <div style={{fontSize:12,color:'var(--t3)'}}>
          순위 기준: <span style={{color:'var(--gold)'}}>①승수</span> → <span style={{color:'var(--blue)'}}>②득실차</span> → <span style={{color:'var(--purple)'}}>③승자승</span> → <span style={{color:'#F97316'}}>④연장자</span>
        </div>
      </div>

      {/* group tabs */}
      <div className="gtabs">
        {activeGroups.map(g=>(
          <button key={g.id} className={`gtab${selGid===g.id?' on':''}`} onClick={()=>setSelGid(g.id)}>
            {g.name}
          </button>
        ))}
      </div>

      {/* podium */}
      {rank.length>=2&&(
        <div className="podium">
          <div className="pc pc2">
            <Medal n={1}/>
            <div style={{fontSize:13,fontWeight:700,color:'var(--t2)',marginTop:2}}>{rank[1]?.name}</div>
            <div style={{fontSize:12,color:'#94A3B8',fontWeight:600}}>{rank[1]?.wins}승 {rank[1]?.losses}패</div>
            <div style={{fontSize:12,color:'#94A3B8'}}>{rank[1]?.diff>0?'+':''}{rank[1]?.diff}</div>
            <div style={{height:50,width:36,background:'rgba(148,163,184,.15)',borderRadius:4,marginTop:6}}/>
          </div>
          <div className="pc pc1">
            <span style={{fontSize:18}}>👑</span>
            <Medal n={0}/>
            <div style={{fontSize:14,fontWeight:800,color:'var(--gold)',marginTop:2}}>{rank[0]?.name}</div>
            <div style={{fontSize:12,color:'var(--gold)',fontWeight:600}}>{rank[0]?.wins}승 {rank[0]?.losses}패</div>
            <div style={{fontSize:12,color:'var(--gold)'}}>{rank[0]?.diff>0?'+':''}{rank[0]?.diff}</div>
            <div style={{height:70,width:36,background:'rgba(212,175,55,.2)',borderRadius:4,marginTop:6}}/>
          </div>
          {rank.length>=3&&(
            <div className="pc pc3">
              <Medal n={2}/>
              <div style={{fontSize:13,fontWeight:700,color:'#F97316',marginTop:2}}>{rank[2]?.name}</div>
              <div style={{fontSize:12,color:'#F97316',fontWeight:600}}>{rank[2]?.wins}승 {rank[2]?.losses}패</div>
              <div style={{fontSize:12,color:'#F97316'}}>{rank[2]?.diff>0?'+':''}{rank[2]?.diff}</div>
              <div style={{height:34,width:36,background:'rgba(180,83,9,.15)',borderRadius:4,marginTop:6}}/>
            </div>
          )}
        </div>
      )}

      {/* full table */}
      <div className="card" style={{overflow:'hidden'}}>
        <div className="rrow" style={{borderBottom:'1px solid var(--border)',opacity:.55}}>
          <div/>
          <div style={{fontSize:10,fontWeight:700,letterSpacing:'.07em',color:'var(--t3)',textTransform:'uppercase'}}>선수명</div>
          <div className="rv" style={{fontSize:10,fontWeight:700,color:'var(--blue)'}}>승</div>
          <div className="rv" style={{fontSize:10,fontWeight:700,color:'var(--red)'}}>패</div>
          <div className="rv hide-xs" style={{fontSize:10,fontWeight:700,color:'var(--t3)'}}>득점</div>
          <div className="rv hide-xs" style={{fontSize:10,fontWeight:700,color:'var(--t3)'}}>실점</div>
          <div className="rv" style={{fontSize:10,fontWeight:700,color:'var(--grn)'}}>득실차</div>
        </div>
        {rank.length===0?(
          <div style={{padding:24,textAlign:'center',color:'var(--t3)',fontSize:13}}>
            경기 결과를 입력하면 순위가 자동 계산됩니다
          </div>
        ):rank.map((p,i)=>(
          <div key={p.id} className={`rrow${i===0?' top':''}`}>
            <div style={{display:'flex',justifyContent:'center'}}><Medal n={i}/></div>
            <div style={{fontSize:13,fontWeight:700,color:i===0?'var(--t1)':'var(--t2)'}}>{p.name}</div>
            <div className="rv" style={{color:'var(--blue)',fontWeight:700}}>{p.wins}</div>
            <div className="rv" style={{color:'var(--red)',fontWeight:700}}>{p.losses}</div>
            <div className="rv hide-xs" style={{color:'var(--t2)'}}>{p.pf}</div>
            <div className="rv hide-xs" style={{color:'var(--t3)'}}>{p.pa}</div>
            <div className="rv" style={{fontWeight:800,fontSize:14,color:p.diff>0?'var(--grn)':p.diff<0?'var(--red)':'var(--t3)'}}>
              {p.diff>0?'+':''}{p.diff}
            </div>
          </div>
        ))}
      </div>

      {/* all groups */}
      <div>
        <div className="row between" style={{marginBottom:10}}>
          <div className="sec" style={{marginBottom:0}}>전체 조 순위 요약</div>
          <button className="btn btn-ghost btn-sm" onClick={()=>setShowAll(v=>!v)}>{showAll?'접기':'모두 보기'}</button>
        </div>
        {showAll&&activeGroups.map(g=>{
          const go={id:g.id,name:g.name,players:players[g.id]||[]};
          const r=calcRank(go,matches).slice(0,3);
          return(
            <div key={g.id} className="card" style={{padding:'13px 15px',marginBottom:8}}>
              <div style={{fontWeight:700,fontSize:13,marginBottom:9,color:'var(--gold)'}}>{g.name}</div>
              {r.length===0?(
                <div style={{fontSize:12,color:'var(--t3)'}}>결과 없음</div>
              ):r.map((p,i)=>(
                <div key={p.id} className="row g10" style={{marginBottom:i<r.length-1?7:0}}>
                  <Medal n={i}/>
                  <span style={{fontSize:13,fontWeight:600,flex:1}}>{p.name}</span>
                  <span style={{fontSize:12,color:'var(--t3)'}}>{p.wins}승 {p.losses}패</span>
                  <span style={{fontSize:12,fontWeight:700,color:p.diff>0?'var(--grn)':p.diff<0?'var(--red)':'var(--t3)'}}>
                    {p.diff>0?'+':''}{p.diff}
                  </span>
                </div>
              ))}
            </div>
          );
        })}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
