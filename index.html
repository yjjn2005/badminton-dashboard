<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>🏸 민턴매치 프로</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #060B18; --bg2: #0D1526; --bg3: #121D35;
      --card: rgba(255,255,255,0.05); --card2: rgba(255,255,255,0.09);
      --border: rgba(255,255,255,0.09); --border2: rgba(255,255,255,0.15);
      --gold: #D4AF37; --gold-l: #F0D060; --gold-d: #9A7D20;
      --green: #10B981; --green-d: #059669;
      --blue: #60A5FA; --red: #F87171; --purple: #A78BFA;
      --t1: #F1F5F9; --t2: #94A3B8; --t3: #475569;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; }
    body {
      font-family: 'Noto Sans KR', -apple-system, sans-serif;
      background: var(--bg); color: var(--t1);
      min-height: 100vh; overflow-x: hidden;
    }
    body::before {
      content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background:
        radial-gradient(ellipse at 15% 0%, rgba(212,175,55,0.07) 0%, transparent 55%),
        radial-gradient(ellipse at 85% 100%, rgba(16,185,129,0.06) 0%, transparent 55%);
    }
    #root { position: relative; z-index: 1; }

    /* ── scrollbar ── */
    ::-webkit-scrollbar { width: 3px; height: 3px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--gold-d); border-radius: 3px; }
    .no-scroll::-webkit-scrollbar { display: none; }

    /* ── header ── */
    .hdr {
      background: rgba(6,11,24,0.9); border-bottom: 1px solid rgba(212,175,55,0.18);
      backdrop-filter: blur(20px); position: sticky; top: 0; z-index: 100;
    }
    .hdr-inner { max-width: 900px; margin: 0 auto; padding: 0 16px; }
    .hdr-top { display: flex; align-items: center; justify-content: space-between; padding: 12px 0 4px; }
    .logo { display: flex; align-items: center; gap: 10px; }
    .logo-icon { font-size: 24px; filter: drop-shadow(0 0 8px rgba(212,175,55,0.5)); }
    .logo-text { font-size: 17px; font-weight: 800; letter-spacing: -0.5px;
      background: linear-gradient(90deg, var(--gold-l), var(--gold), var(--gold-d));
      background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      animation: shimmer 3s linear infinite; }
    .logo-sub { font-size: 10px; color: var(--t3); letter-spacing: 0.08em; margin-top: 1px; }
    .live-badge { display: flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 700; color: var(--gold); }
    .live-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green);
      box-shadow: 0 0 8px var(--green); animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }
    @keyframes shimmer { 0%{background-position:-200% center} 100%{background-position:200% center} }
    @keyframes fadeUp { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }

    /* ── nav tabs ── */
    .nav { display: flex; gap: 0; overflow-x: auto; padding-bottom: 1px; }
    .nav::-webkit-scrollbar { display: none; }
    .nav-btn {
      display: flex; align-items: center; gap: 5px;
      padding: 10px 14px; font-size: 12px; font-weight: 600;
      color: var(--t3); border-bottom: 2px solid transparent;
      background: transparent; border-left: none; border-right: none; border-top: none;
      cursor: pointer; white-space: nowrap; font-family: inherit;
      transition: all 0.2s;
    }
    .nav-btn:hover { color: var(--t2); }
    .nav-btn.on { color: var(--gold); border-bottom-color: var(--gold); }

    /* ── main ── */
    .main { max-width: 900px; margin: 0 auto; padding: 20px 16px 80px; }

    /* ── glass card ── */
    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 14px; backdrop-filter: blur(10px);
    }
    .card-gold {
      background: linear-gradient(135deg, rgba(212,175,55,0.1), rgba(212,175,55,0.02));
      border: 1px solid rgba(212,175,55,0.3); border-radius: 14px;
    }

    /* ── buttons ── */
    .btn { border: none; cursor: pointer; font-family: inherit; font-weight: 700; border-radius: 10px; display: inline-flex; align-items: center; gap: 6px; transition: all 0.15s; }
    .btn-gold { background: linear-gradient(135deg, var(--gold), var(--gold-d)); color: #1a1000; padding: 10px 18px; font-size: 13px; box-shadow: 0 4px 14px rgba(212,175,55,0.25); }
    .btn-gold:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(212,175,55,0.4); }
    .btn-green { background: linear-gradient(135deg, var(--green), var(--green-d)); color: #fff; padding: 10px 18px; font-size: 13px; box-shadow: 0 4px 14px rgba(16,185,129,0.25); }
    .btn-green:hover { transform: translateY(-1px); }
    .btn-ghost { background: transparent; color: var(--t2); border: 1px solid var(--border); padding: 8px 14px; font-size: 12px; }
    .btn-ghost:hover { background: var(--card2); color: var(--t1); }
    .btn-sm { padding: 6px 12px; font-size: 12px; border-radius: 8px; }
    .btn-icon { background: transparent; border: none; color: var(--t3); cursor: pointer; padding: 5px; border-radius: 7px; transition: all 0.15s; display: flex; }
    .btn-icon:hover { background: rgba(248,113,113,0.15); color: var(--red); }
    .btn-score {
      width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--border2);
      background: var(--card2); color: var(--t1); font-size: 20px; font-weight: 800;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: all 0.1s; user-select: none; -webkit-user-select: none;
    }
    .btn-score:active { transform: scale(0.9); background: var(--gold); color: #1a1000; }

    /* ── inputs ── */
    .inp {
      background: rgba(255,255,255,0.05); border: 1px solid var(--border);
      border-radius: 10px; padding: 10px 13px; color: var(--t1);
      font-size: 14px; font-family: inherit; outline: none; width: 100%;
      transition: all 0.2s;
    }
    .inp:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(212,175,55,0.1); }
    .inp::placeholder { color: var(--t3); }

    /* ── badges ── */
    .medal { display: inline-flex; align-items: center; justify-content: center;
      border-radius: 50%; font-size: 12px; font-weight: 800; width: 30px; height: 30px; }
    .medal-1 { background: linear-gradient(135deg,#F0D060,#D4AF37); color:#1a1000; box-shadow:0 2px 10px rgba(212,175,55,0.4); }
    .medal-2 { background: linear-gradient(135deg,#E2E8F0,#94A3B8); color:#0f172a; }
    .medal-3 { background: linear-gradient(135deg,#FCA97A,#B45309); color:#fff; }
    .medal-n { background: rgba(255,255,255,0.07); color: var(--t3); font-size: 11px; }

    /* ── status pills ── */
    .pill-done { background: rgba(16,185,129,0.15); color: var(--green); border: 1px solid rgba(16,185,129,0.3); border-radius: 100px; padding: 2px 10px; font-size: 11px; font-weight: 700; }
    .pill-wait { background: rgba(71,85,105,0.2); color: var(--t3); border: 1px solid rgba(71,85,105,0.3); border-radius: 100px; padding: 2px 10px; font-size: 11px; }
    .pill-active { background: rgba(212,175,55,0.15); color: var(--gold); border: 1px solid rgba(212,175,55,0.3); border-radius: 100px; padding: 2px 10px; font-size: 11px; font-weight: 700; }

    /* ── group selector ── */
    .group-tabs { display: flex; gap: 6px; flex-wrap: wrap; }
    .gtab {
      padding: 5px 14px; border-radius: 100px; font-size: 12px; font-weight: 600;
      cursor: pointer; border: 1px solid var(--border); background: transparent;
      color: var(--t3); transition: all 0.15s; font-family: inherit; white-space: nowrap;
    }
    .gtab:hover { color: var(--t2); border-color: var(--border2); }
    .gtab.on { background: var(--gold); color: #1a1000; border-color: var(--gold); box-shadow: 0 3px 10px rgba(212,175,55,0.3); }
    .gtab.empty { opacity: 0.4; }

    /* ── score card (match) ── */
    .match-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 14px; padding: 16px; transition: all 0.15s;
      display: flex; flex-direction: column; gap: 12px;
    }
    .match-card.played { border-color: rgba(16,185,129,0.2); background: rgba(16,185,129,0.03); }
    .match-teams { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; }
    .team-name { font-size: 14px; font-weight: 700; line-height: 1.3; }
    .team-left { text-align: right; }
    .team-right { text-align: left; }
    .win-label { font-size: 10px; font-weight: 800; color: var(--gold); letter-spacing: 0.05em; }
    .score-ctrl { display: flex; align-items: center; gap: 6px; justify-content: center; }
    .score-display {
      width: 52px; height: 44px; background: rgba(255,255,255,0.06);
      border: 1px solid var(--border2); border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; font-weight: 800; color: var(--t1);
    }
    .score-display.winner { color: var(--gold); border-color: rgba(212,175,55,0.4); background: rgba(212,175,55,0.08); }
    .vs-divider { font-size: 11px; font-weight: 800; color: var(--t3); text-align: center; min-width: 32px; }

    /* ── ranking card ── */
    .rank-row { display: grid; grid-template-columns: 36px 1fr repeat(5,44px); align-items: center; padding: 12px 14px; border-bottom: 1px solid rgba(255,255,255,0.04); gap: 4px; }
    .rank-row:last-child { border-bottom: none; }
    .rank-row.top { background: rgba(212,175,55,0.04); }
    .rank-val { text-align: center; font-size: 13px; }
    .rank-win { color: var(--blue); font-weight: 700; }
    .rank-lose { color: var(--red); font-weight: 700; }
    .rank-diff { font-weight: 800; font-size: 14px; }
    .rank-diff.pos { color: var(--green); }
    .rank-diff.neg { color: var(--red); }

    /* ── stat box ── */
    .stat-box { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; }
    .stat-num { font-size: 32px; font-weight: 800; letter-spacing: -1px; line-height: 1; margin-top: 8px; }
    .stat-label { font-size: 11px; font-weight: 600; color: var(--t3); text-transform: uppercase; letter-spacing: 0.06em; }
    .stat-sub { font-size: 12px; color: var(--t3); margin-top: 4px; }

    /* ── progress ── */
    .prog-track { background: rgba(255,255,255,0.06); border-radius: 100px; height: 8px; overflow: hidden; }
    .prog-fill { height: 100%; border-radius: 100px; background: linear-gradient(90deg,var(--green-d),var(--green),#34D399); transition: width 1s cubic-bezier(0.4,0,0.2,1); box-shadow: 0 0 10px rgba(16,185,129,0.4); }

    /* ── section title ── */
    .sec { font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--t3); margin-bottom: 10px; }

    /* ── grid helpers ── */
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .grid4 { display: grid; grid-template-columns: repeat(4,1fr); gap: 10px; }
    @media(max-width:500px) { .grid4 { grid-template-columns: repeat(2,1fr); } }
    .flex { display: flex; }
    .gap-8 { gap: 8px; }
    .gap-12 { gap: 12px; }
    .gap-16 { gap: 16px; }
    .gap-20 { gap: 20px; }
    .col { flex-direction: column; }
    .wrap { flex-wrap: wrap; }
    .between { justify-content: space-between; }
    .center { align-items: center; }

    /* ── check ring ── */
    .check-ring {
      width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--t3);
      display: flex; align-items: center; justify-content: center; cursor: pointer;
      transition: all 0.15s; background: transparent; flex-shrink: 0;
    }
    .check-ring.on { border-color: var(--green); background: rgba(16,185,129,0.15); color: var(--green); }
    .check-ring:not(.on):hover { border-color: var(--green); }

    /* ── empty group indicator ── */
    .empty-group { opacity: 0.4; pointer-events: none; }

    /* ── podium ── */
    .podium { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
    .podium-card { border-radius: 12px; padding: 16px 10px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .podium-1 { background: rgba(212,175,55,0.12); border: 1px solid rgba(212,175,55,0.35); order: 2; }
    .podium-2 { background: rgba(148,163,184,0.07); border: 1px solid rgba(148,163,184,0.2); order: 1; }
    .podium-3 { background: rgba(180,83,9,0.07); border: 1px solid rgba(180,83,9,0.2); order: 3; }
    .podium-name { font-size: 13px; font-weight: 700; line-height: 1.3; }
    .podium-stat { font-size: 12px; font-weight: 600; }
    .podium-bar { border-radius: 4px; width: 36px; }

    /* ── notice ── */
    .notice { background: rgba(212,175,55,0.08); border: 1px solid rgba(212,175,55,0.25); border-radius: 12px; padding: 14px 16px; font-size: 13px; color: var(--t2); line-height: 1.6; }
    .notice b { color: var(--gold); }

    .fade { animation: fadeUp 0.35s ease; }

    /* ── toast ── */
    .toast {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: rgba(13,21,38,0.97); border-radius: 12px; padding: 12px 18px;
      display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600;
      z-index: 999; backdrop-filter: blur(16px); min-width: 240px; max-width: 90vw;
      box-shadow: 0 16px 50px rgba(0,0,0,0.5);
      animation: fadeUp 0.25s ease;
    }
    .toast.ok { border: 1px solid rgba(16,185,129,0.4); }
    .toast.err { border: 1px solid rgba(248,113,113,0.4); }
    .toast.info { border: 1px solid rgba(212,175,55,0.35); }

    @media(max-width:500px){
      .rank-row { grid-template-columns: 30px 1fr repeat(3,36px); }
      .rank-row .hide-sm { display: none; }
    }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useCallback } = React;
const genId = () => Math.random().toString(36).substr(2,9);

// ─── SVG Icons ──────────────────────────────────────────────────────
const SVG = ({ d, s=18, c='currentColor' }) => (
  <svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth="1.9" strokeLinecap="round" strokeLinejoin="round" style={{flexShrink:0}}>
    <path d={d}/>
  </svg>
);
const I = {
  trophy:   "M6 9H4.5a2.5 2.5 0 0 1 0-5H6m12 0h1.5a2.5 2.5 0 0 1 0 5H18M4 1h16v2a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4V1zm4 14a4 4 0 0 0 8 0M12 19v4m-4 0h8",
  users:    "M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2M9 3a4 4 0 1 1 0 8 4 4 0 0 1 0-8zm12 18v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75",
  calendar: "M8 2v4M16 2v4M3 10h18M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z",
  chart:    "M3 3v18h18M7 16l4-4 4 4 5-5",
  check:    "M20 6L9 17l-5-5",
  plus:     "M12 5v14M5 12h14",
  trash:    "M3 6h18M19 6l-1 14H6L5 6M10 11v6M14 11v6M9 6V4h6v2",
  minus:    "M5 12h14",
  star:     "M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z",
  info:     "M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10zM12 16v-4M12 8h.01",
};

// ─── Ranking Calc ───────────────────────────────────────────────────
function calcRank(group, allMatches) {
  const gm = allMatches.filter(m => m.gid === group.id && m.played);
  let stats = group.teams.map(t => ({ ...t, played:0, wins:0, losses:0, pf:0, pa:0, diff:0 }));
  gm.forEach(m => {
    const i1 = stats.findIndex(t => t.id===m.t1id);
    const i2 = stats.findIndex(t => t.id===m.t2id);
    if(i1<0||i2<0) return;
    stats[i1].played++; stats[i2].played++;
    stats[i1].pf+=m.s1; stats[i1].pa+=m.s2;
    stats[i2].pf+=m.s2; stats[i2].pa+=m.s1;
    if(m.s1>m.s2){stats[i1].wins++;stats[i2].losses++;}
    else if(m.s2>m.s1){stats[i2].wins++;stats[i1].losses++;}
  });
  stats.forEach(t => t.diff = t.pf - t.pa);
  return stats.sort((a,b) => {
    if(b.diff!==a.diff) return b.diff-a.diff;
    const h = gm.find(m=>(m.t1id===a.id&&m.t2id===b.id)||(m.t1id===b.id&&m.t2id===a.id));
    if(h){ const as=h.t1id===a.id?h.s1:h.s2, bs=h.t1id===b.id?h.s1:h.s2; if(as!==bs) return bs-as; }
    return b.age-a.age;
  });
}

function buildMatches(gid, teams, existingMatches) {
  const existing = existingMatches.filter(m => m.gid!==gid);
  const newM = [];
  for(let i=0;i<teams.length;i++)
    for(let j=i+1;j<teams.length;j++)
      newM.push({id:genId(),gid,t1id:teams[i].id,t2id:teams[j].id,t1n:teams[i].name,t2n:teams[j].name,s1:0,s2:0,played:false});
  return [...existing, ...newM];
}

// ─── Toast ──────────────────────────────────────────────────────────
function Toast({msg,type,onDone}) {
  useEffect(()=>{const t=setTimeout(onDone,2800);return()=>clearTimeout(t);},[]);
  const col = type==='ok'?'#10B981':type==='err'?'#F87171':'#D4AF37';
  const icon = type==='ok'?I.check:type==='err'?I.info:I.star;
  return(
    <div className={`toast ${type}`}>
      <SVG d={icon} s={16} c={col}/>
      <span style={{color:'#E2E8F0'}}>{msg}</span>
    </div>
  );
}

// ─── Medal ──────────────────────────────────────────────────────────
function Medal({n}) {
  if(n===0) return <span className="medal medal-1">1</span>;
  if(n===1) return <span className="medal medal-2">2</span>;
  if(n===2) return <span className="medal medal-3">3</span>;
  return <span className="medal medal-n">{n+1}</span>;
}

// ═══════════════════════════════════════════════════════════════════
// MAIN APP
// ═══════════════════════════════════════════════════════════════════
function App() {
  // Pre-create 1조~10조 (all empty)
  const [groups, setGroups] = useState(() =>
    Array.from({length:10},(_,i)=>({id:genId(), name:`${i+1}조`, teams:[]}))
  );
  const [matches, setMatches] = useState([]);
  const [tab, setTab] = useState('dashboard');
  const [toast, setToast] = useState(null);

  const activeGroups = groups.filter(g => g.teams.length > 0);

  const showToast = (msg, type='info') => {
    setToast({msg,type});
    setTimeout(()=>setToast(null),3000);
  };

  const setGroupTeams = (gid, teams) => {
    setGroups(prev => prev.map(g => g.id===gid ? {...g,teams} : g));
    setMatches(prev => buildMatches(gid, teams, prev));
  };

  const tabs = [
    {id:'dashboard',icon:I.chart,label:'대시보드'},
    {id:'setup',icon:I.users,label:'팀 등록'},
    {id:'scores',icon:I.calendar,label:'점수 입력'},
    {id:'ranks',icon:I.trophy,label:'순위표'},
  ];

  return (
    <div>
      <header className="hdr">
        <div className="hdr-inner">
          <div className="hdr-top">
            <div className="logo">
              <span className="logo-icon">🏸</span>
              <div>
                <div className="logo-text">민턴매치 프로</div>
                <div className="logo-sub">BADMINTON TOURNAMENT</div>
              </div>
            </div>
            <div className="live-badge">
              <div className="live-dot"/>
              LIVE
            </div>
          </div>
          <div className="nav no-scroll">
            {tabs.map(t=>(
              <button key={t.id} className={`nav-btn${tab===t.id?' on':''}`} onClick={()=>setTab(t.id)}>
                <SVG d={t.icon} s={13}/>{t.label}
              </button>
            ))}
          </div>
        </div>
      </header>

      <div className="main fade" key={tab}>
        {tab==='dashboard' && <Dashboard groups={groups} activeGroups={activeGroups} matches={matches} setTab={setTab}/>}
        {tab==='setup'     && <Setup groups={groups} setGroupTeams={setGroupTeams} showToast={showToast}/>}
        {tab==='scores'    && <Scores activeGroups={activeGroups} matches={matches} setMatches={setMatches} showToast={showToast}/>}
        {tab==='ranks'     && <Ranks activeGroups={activeGroups} matches={matches}/>}
      </div>

      {toast && <Toast {...toast} onDone={()=>setToast(null)}/>}
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════════
// 1. DASHBOARD
// ═══════════════════════════════════════════════════════════════════
function Dashboard({groups,activeGroups,matches,setTab}) {
  const total = matches.length;
  const done  = matches.filter(m=>m.played).length;
  const pct   = total===0?0:Math.round(done/total*100);
  const totalTeams = activeGroups.reduce((s,g)=>s+g.teams.length,0);

  return (
    <div className="flex col gap-16">
      {/* notice */}
      <div className="notice">
        <b>📋 사용 방법</b><br/>
        <b>① 팀 등록</b>에서 각 조에 선수 팀을 추가하세요 (참가 없는 조는 자동 비활성화)<br/>
        <b>② 점수 입력</b>에서 조장이 핸드폰으로 경기 결과를 입력하세요<br/>
        <b>③ 순위표</b>에서 조별 1·2·3위를 실시간 확인하세요
      </div>

      {/* stats */}
      <div className="grid4">
        {[
          {label:'활성 조',val:activeGroups.length,sub:`/ 10조 운영`,c:'var(--gold)'},
          {label:'참가 팀',val:totalTeams,sub:'팀',c:'var(--green)'},
          {label:'전체 경기',val:total,sub:'경기',c:'var(--blue)'},
          {label:'완료',val:done,sub:`/ ${total} (${pct}%)`,c:'var(--purple)'},
        ].map(s=>(
          <div key={s.label} className="stat-box">
            <div className="stat-label">{s.label}</div>
            <div className="stat-num" style={{color:s.c}}>{s.val}</div>
            <div className="stat-sub">{s.sub}</div>
          </div>
        ))}
      </div>

      {/* progress */}
      {total>0 && (
        <div className="card" style={{padding:'20px 22px'}}>
          <div className="flex between center" style={{marginBottom:12}}>
            <div>
              <div style={{fontSize:14,fontWeight:700}}>대회 진행률</div>
              <div style={{fontSize:12,color:'var(--t3)',marginTop:3}}>{done}경기 완료 · {total-done}경기 남음</div>
            </div>
            <div style={{fontSize:30,fontWeight:800,color:'var(--green)'}}>{pct}<span style={{fontSize:14,fontWeight:500}}>%</span></div>
          </div>
          <div className="prog-track"><div className="prog-fill" style={{width:`${pct}%`}}/></div>
        </div>
      )}

      {/* group leaders */}
      <div className="card" style={{padding:'20px 20px'}}>
        <div className="flex between center" style={{marginBottom:14}}>
          <div className="flex gap-8 center">
            <SVG d={I.trophy} s={18} c="var(--gold)"/>
            <span style={{fontWeight:700,fontSize:15}}>현재 조별 선두팀</span>
          </div>
          <button className="btn btn-ghost btn-sm" onClick={()=>setTab('ranks')}>
            전체 순위 →
          </button>
        </div>
        {activeGroups.length===0 ? (
          <div style={{textAlign:'center',color:'var(--t3)',padding:'20px 0',fontSize:14}}>
            팀 등록 탭에서 팀을 추가하면 여기에 표시됩니다
          </div>
        ) : (
          <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(190px,1fr))',gap:10}}>
            {activeGroups.map(g=>{
              const rank = calcRank(g,matches);
              const leader = rank[0];
              return (
                <div key={g.id} className="card-gold" style={{padding:'14px 16px'}}>
                  <div style={{fontSize:10,fontWeight:700,color:'var(--gold)',letterSpacing:'0.1em',marginBottom:6}}>{g.name}</div>
                  {leader ? (
                    <>
                      <div style={{fontSize:14,fontWeight:700,color:'var(--t1)'}}>{leader.name}</div>
                      <div className="flex gap-12" style={{marginTop:6}}>
                        <span style={{fontSize:12,color:'var(--t3)'}}>승 <b style={{color:'var(--blue)'}}>{leader.wins}</b></span>
                        <span style={{fontSize:12,color:'var(--t3)'}}>패 <b style={{color:'var(--red)'}}>{leader.losses}</b></span>
                        <span style={{fontSize:12,color:'var(--t3)'}}>득실 <b style={{color:leader.diff>=0?'var(--green)':'var(--red)'}}>{leader.diff>0?'+':''}{leader.diff}</b></span>
                      </div>
                    </>
                  ) : <div style={{fontSize:12,color:'var(--t3)',marginTop:4}}>경기 결과 없음</div>}
                </div>
              );
            })}
          </div>
        )}
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════════
// 2. TEAM SETUP
// ═══════════════════════════════════════════════════════════════════
function Setup({groups,setGroupTeams,showToast}) {
  const [selGid, setSelGid] = useState(groups[0].id);
  const [name, setName] = useState('');
  const [age, setAge] = useState('');
  const sel = groups.find(g=>g.id===selGid);

  const addTeam = () => {
    if(!name.trim()) return;
    if(sel.teams.length>=6){showToast('최대 6팀까지 편성 가능합니다','err');return;}
    const teams=[...sel.teams,{id:genId(),name:name.trim(),age:Number(age)||0}];
    setGroupTeams(selGid,teams);
    setName(''); setAge('');
    showToast(`${sel.name}에 팀 추가 완료`,'ok');
  };

  const delTeam = (tid) => {
    const teams = sel.teams.filter(t=>t.id!==tid);
    setGroupTeams(selGid,teams);
  };

  return (
    <div className="flex col gap-16">
      {/* notice */}
      <div className="notice">
        <b>1조~10조</b>가 미리 설정되어 있습니다. 참가 선수가 없는 조는 자동으로 <b>비활성화</b>됩니다.
        각 조에 팀명을 입력하면 자동으로 대진이 생성됩니다.
      </div>

      {/* group selector */}
      <div>
        <div className="sec">조 선택</div>
        <div className="group-tabs">
          {groups.map(g=>(
            <button key={g.id}
              className={`gtab${selGid===g.id?' on':''}${g.teams.length===0?' empty':''}`}
              onClick={()=>setSelGid(g.id)}>
              {g.name} {g.teams.length>0?`(${g.teams.length})`:''}
            </button>
          ))}
        </div>
      </div>

      {/* team management */}
      {sel && (
        <div className="card" style={{padding:20}}>
          <div className="flex between center" style={{marginBottom:16}}>
            <div>
              <div style={{fontSize:18,fontWeight:800}}>{sel.name}</div>
              <div style={{fontSize:12,color:'var(--t3)',marginTop:2}}>
                {sel.teams.length===0?'팀 없음 (비활성)':
                 sel.teams.length===1?'팀 1개 — 팀이 2개 이상이어야 경기가 생성됩니다':
                 `${sel.teams.length}팀 · ${sel.teams.length*(sel.teams.length-1)/2}경기 예정`}
              </div>
            </div>
            <div style={{fontSize:26,fontWeight:800,color:'var(--gold)'}}>
              {sel.teams.length}<span style={{fontSize:12,color:'var(--t3)',fontWeight:400}}>/6</span>
            </div>
          </div>

          {/* existing teams */}
          {sel.teams.length>0 && (
            <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(170px,1fr))',gap:8,marginBottom:18}}>
              {sel.teams.map(t=>(
                <div key={t.id} style={{background:'var(--card2)',border:'1px solid var(--border)',borderRadius:10,padding:'12px 14px',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                  <div>
                    <div style={{fontSize:13,fontWeight:700}}>{t.name}</div>
                    {t.age>0 && <div style={{fontSize:11,color:'var(--t3)',marginTop:2}}>합산나이 {t.age}</div>}
                  </div>
                  <button className="btn-icon" onClick={()=>delTeam(t.id)}><SVG d={I.trash} s={14}/></button>
                </div>
              ))}
            </div>
          )}

          {/* add team */}
          <div style={{background:'rgba(255,255,255,0.03)',border:'1px solid var(--border)',borderRadius:10,padding:14}}>
            <div className="sec" style={{marginBottom:8}}>팀 추가</div>
            <div className="flex col gap-8">
              <input className="inp" placeholder="팀명 (예: 홍길동/이순신)"
                value={name} onChange={e=>setName(e.target.value)}
                onKeyDown={e=>e.key==='Enter'&&addTeam()}/>
              <div className="flex gap-8">
                <input className="inp" type="number" placeholder="합산나이 (동점 시 연장자 우선)"
                  value={age} onChange={e=>setAge(e.target.value)}
                  onKeyDown={e=>e.key==='Enter'&&addTeam()}
                  style={{flex:1}}/>
                <button className="btn btn-green" onClick={addTeam}>
                  <SVG d={I.plus} s={16}/>추가
                </button>
              </div>
            </div>
          </div>
        </div>
      )}

      {/* summary */}
      <div className="card" style={{padding:18}}>
        <div className="sec" style={{marginBottom:10}}>전체 조 현황</div>
        <div style={{display:'flex',flexDirection:'column',gap:6}}>
          {groups.map(g=>(
            <div key={g.id} className="flex between center"
              style={{padding:'8px 0',borderBottom:'1px solid rgba(255,255,255,0.04)'}}>
              <span style={{fontSize:13,fontWeight:600,color:g.teams.length>0?'var(--t1)':'var(--t3)'}}>{g.name}</span>
              {g.teams.length===0
                ? <span className="pill-wait">비활성</span>
                : g.teams.length===1
                  ? <span className="pill-wait">{g.teams.length}팀 (최소 2팀 필요)</span>
                  : <span className="pill-active">{g.teams.length}팀 · {g.teams.length*(g.teams.length-1)/2}경기</span>
              }
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════════
// 3. SCORE INPUT — 조장용 모바일 UI
// ═══════════════════════════════════════════════════════════════════
function Scores({activeGroups,matches,setMatches,showToast}) {
  const [selGid, setSelGid] = useState(activeGroups[0]?.id||null);
  useEffect(()=>{if(!selGid&&activeGroups.length>0) setSelGid(activeGroups[0].id);},[activeGroups]);

  const gMatches = matches.filter(m=>m.gid===selGid);
  const done = gMatches.filter(m=>m.played).length;

  const adj = (mid, field, delta) => {
    setMatches(prev=>prev.map(m=>{
      if(m.id!==mid) return m;
      const val = Math.max(0,(m[field]||0)+delta);
      return {...m,[field]:val,played:true};
    }));
  };

  const togglePlayed = (mid) => {
    setMatches(prev=>prev.map(m=>m.id===mid?{...m,played:!m.played}:m));
  };

  if(activeGroups.length===0) return (
    <div className="card" style={{padding:32,textAlign:'center',color:'var(--t3)'}}>
      팀 등록 탭에서 먼저 팀을 추가해주세요
    </div>
  );

  return (
    <div className="flex col gap-14">
      {/* group select */}
      <div>
        <div className="sec">조 선택</div>
        <div className="group-tabs">
          {activeGroups.map(g=>{
            const gm = matches.filter(m=>m.gid===g.id);
            const gd = gm.filter(m=>m.played).length;
            return(
              <button key={g.id}
                className={`gtab${selGid===g.id?' on':''}`}
                onClick={()=>setSelGid(g.id)}>
                {g.name} {gd>0?`${gd}/${gm.length}`:''}
              </button>
            );
          })}
        </div>
      </div>

      {/* progress for this group */}
      {gMatches.length>0 && (
        <div className="flex between center">
          <span style={{fontSize:12,color:'var(--t3)'}}>{done}/{gMatches.length} 경기 완료</span>
          {done===gMatches.length && (
            <span className="pill-done">✅ 조 완료</span>
          )}
        </div>
      )}

      {/* match cards */}
      {gMatches.length===0
        ? <div className="card" style={{padding:32,textAlign:'center',color:'var(--t3)'}}>
            이 조에 생성된 경기가 없습니다
          </div>
        : gMatches.map(m=>{
          const w1 = m.played && m.s1>m.s2;
          const w2 = m.played && m.s2>m.s1;
          return (
            <div key={m.id} className={`match-card${m.played?' played':''}`}>
              {/* header */}
              <div className="flex between center">
                <div style={{fontSize:11,color:'var(--t3)',fontWeight:600,letterSpacing:'0.05em'}}>
                  {m.played ? (m.s1===m.s2?'무승부':'경기 완료') : '대기'}
                </div>
                <button className={`check-ring${m.played?' on':''}`} onClick={()=>togglePlayed(m.id)}>
                  {m.played && <SVG d={I.check} s={14} c="var(--green)"/>}
                </button>
              </div>

              {/* teams + score controls */}
              <div className="match-teams">
                {/* team 1 */}
                <div className="team-left">
                  {w1 && <div className="win-label">🏆 WIN</div>}
                  <div className="team-name" style={{color:w1?'var(--t1)':w2?'var(--t3)':'var(--t2)'}}>{m.t1n}</div>
                </div>

                {/* score */}
                <div className="flex col" style={{alignItems:'center',gap:6}}>
                  <div className="flex gap-8 center">
                    <div className="score-ctrl">
                      <button className="btn-score" onPointerDown={()=>adj(m.id,'s1',-1)}>−</button>
                      <div className={`score-display${w1?' winner':''}`}>{m.s1}</div>
                      <button className="btn-score" onPointerDown={()=>adj(m.id,'s1',1)}>+</button>
                    </div>
                    <div className="vs-divider">VS</div>
                    <div className="score-ctrl">
                      <button className="btn-score" onPointerDown={()=>adj(m.id,'s2',-1)}>−</button>
                      <div className={`score-display${w2?' winner':''}`}>{m.s2}</div>
                      <button className="btn-score" onPointerDown={()=>adj(m.id,'s2',1)}>+</button>
                    </div>
                  </div>
                </div>

                {/* team 2 */}
                <div className="team-right">
                  {w2 && <div className="win-label" style={{textAlign:'left'}}>🏆 WIN</div>}
                  <div className="team-name" style={{color:w2?'var(--t1)':w1?'var(--t3)':'var(--t2)'}}>{m.t2n}</div>
                </div>
              </div>
            </div>
          );
        })
      }
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════════
// 4. RANKINGS
// ═══════════════════════════════════════════════════════════════════
function Ranks({activeGroups,matches}) {
  const [selGid, setSelGid] = useState(activeGroups[0]?.id||null);
  useEffect(()=>{if(!selGid&&activeGroups.length>0) setSelGid(activeGroups[0].id);},[activeGroups]);
  const [showAll, setShowAll] = useState(false);

  if(activeGroups.length===0) return(
    <div className="card" style={{padding:32,textAlign:'center',color:'var(--t3)'}}>
      팀 등록 후 경기 결과를 입력하면 순위가 자동 계산됩니다
    </div>
  );

  const group = activeGroups.find(g=>g.id===selGid);
  const rank  = group ? calcRank(group,matches) : [];

  return (
    <div className="flex col gap-14">
      {/* header */}
      <div className="card-gold" style={{padding:'20px 22px'}}>
        <div className="flex gap-10 center" style={{marginBottom:6}}>
          <SVG d={I.trophy} s={22} c="var(--gold)"/>
          <div style={{fontSize:20,fontWeight:800,
            background:'linear-gradient(90deg,var(--gold-l),var(--gold),var(--gold-d))',
            backgroundSize:'200% auto',WebkitBackgroundClip:'text',WebkitTextFillColor:'transparent',
            animation:'shimmer 3s linear infinite'}}>
            최종 조별 순위
          </div>
        </div>
        <div style={{fontSize:12,color:'var(--t3)'}}>
          순위 기준: <span style={{color:'var(--gold)'}}>득실차</span> → <span style={{color:'var(--blue)'}}>승자승</span> → <span style={{color:'var(--purple)'}}>연장자(합산나이)</span>
        </div>
      </div>

      {/* group tabs */}
      <div className="group-tabs">
        {activeGroups.map(g=>(
          <button key={g.id} className={`gtab${selGid===g.id?' on':''}`} onClick={()=>setSelGid(g.id)}>
            {g.name}
          </button>
        ))}
      </div>

      {/* podium — top 3 */}
      {rank.length>=2 && (
        <div className="podium">
          {/* 2nd */}
          <div className="podium-card podium-2">
            <Medal n={1}/>
            <div className="podium-name" style={{color:'var(--t2)'}}>{rank[1]?.name}</div>
            <div className="podium-stat" style={{color:'#94A3B8'}}>{rank[1]?.wins}승 {rank[1]?.losses}패</div>
            <div className="podium-stat" style={{color:'#94A3B8'}}>{rank[1]?.diff>0?'+':''}{rank[1]?.diff}</div>
            <div className="podium-bar" style={{height:48,background:'rgba(148,163,184,0.15)',marginTop:6}}/>
          </div>
          {/* 1st */}
          <div className="podium-card podium-1">
            <span style={{fontSize:20}}>👑</span>
            <Medal n={0}/>
            <div className="podium-name" style={{color:'var(--gold)',fontWeight:800}}>{rank[0]?.name}</div>
            <div className="podium-stat" style={{color:'var(--gold)'}}>{rank[0]?.wins}승 {rank[0]?.losses}패</div>
            <div className="podium-stat" style={{color:'var(--gold)'}}>{rank[0]?.diff>0?'+':''}{rank[0]?.diff}</div>
            <div className="podium-bar" style={{height:68,background:'rgba(212,175,55,0.2)',marginTop:6}}/>
          </div>
          {/* 3rd */}
          {rank.length>=3 && (
            <div className="podium-card podium-3">
              <Medal n={2}/>
              <div className="podium-name" style={{color:'#F97316'}}>{rank[2]?.name}</div>
              <div className="podium-stat" style={{color:'#F97316'}}>{rank[2]?.wins}승 {rank[2]?.losses}패</div>
              <div className="podium-stat" style={{color:'#F97316'}}>{rank[2]?.diff>0?'+':''}{rank[2]?.diff}</div>
              <div className="podium-bar" style={{height:36,background:'rgba(180,83,9,0.15)',marginTop:6}}/>
            </div>
          )}
        </div>
      )}

      {/* full table */}
      <div className="card" style={{overflow:'hidden'}}>
        {/* header */}
        <div className="rank-row" style={{borderBottom:'1px solid var(--border)',opacity:.6}}>
          <div/>
          <div style={{fontSize:10,fontWeight:700,letterSpacing:'0.08em',textTransform:'uppercase',color:'var(--t3)'}}>팀명</div>
          <div className="rank-val" style={{fontSize:10,fontWeight:700,letterSpacing:'0.06em',color:'var(--blue)'}}>승</div>
          <div className="rank-val hide-sm" style={{fontSize:10,fontWeight:700,letterSpacing:'0.06em',color:'var(--red)'}}>패</div>
          <div className="rank-val hide-sm" style={{fontSize:10,fontWeight:700,letterSpacing:'0.06em',color:'var(--t3)'}}>득점</div>
          <div className="rank-val hide-sm" style={{fontSize:10,fontWeight:700,letterSpacing:'0.06em',color:'var(--t3)'}}>실점</div>
          <div className="rank-val" style={{fontSize:10,fontWeight:700,letterSpacing:'0.06em',color:'var(--green)'}}>득실</div>
        </div>

        {rank.length===0
          ? <div style={{padding:28,textAlign:'center',color:'var(--t3)',fontSize:13}}>경기 결과를 입력하면 자동으로 순위가 계산됩니다</div>
          : rank.map((t,i)=>(
            <div key={t.id} className={`rank-row${i===0?' top':''}`}>
              <div style={{display:'flex',justifyContent:'center'}}><Medal n={i}/></div>
              <div style={{fontSize:13,fontWeight:700,color:i===0?'var(--t1)':'var(--t2)'}}>{t.name}</div>
              <div className="rank-val rank-win">{t.wins}</div>
              <div className="rank-val rank-lose hide-sm">{t.losses}</div>
              <div className="rank-val" style={{color:'var(--t2)'}}>{t.pf}</div>
              <div className="rank-val hide-sm" style={{color:'var(--t3)'}}>{t.pa}</div>
              <div className={`rank-val rank-diff${t.diff>0?' pos':t.diff<0?' neg':''}`}>
                {t.diff>0?'+':''}{t.diff}
              </div>
            </div>
          ))
        }
      </div>

      {/* all groups summary */}
      <div>
        <div className="flex between center" style={{marginBottom:10}}>
          <div className="sec" style={{marginBottom:0}}>전체 조 순위 요약</div>
          <button className="btn btn-ghost btn-sm" onClick={()=>setShowAll(v=>!v)}>
            {showAll?'접기':'모두 보기'}
          </button>
        </div>
        {showAll && activeGroups.map(g=>{
          const r = calcRank(g,matches);
          const top3 = r.slice(0,3);
          return(
            <div key={g.id} className="card" style={{padding:'14px 16px',marginBottom:8}}>
              <div style={{fontWeight:700,fontSize:13,marginBottom:10,color:'var(--gold)'}}>{g.name}</div>
              <div className="flex col gap-6">
                {top3.length===0
                  ? <div style={{fontSize:12,color:'var(--t3)'}}>결과 없음</div>
                  : top3.map((t,i)=>(
                    <div key={t.id} className="flex gap-10 center">
                      <Medal n={i}/>
                      <span style={{fontSize:13,fontWeight:600,flex:1}}>{t.name}</span>
                      <span style={{fontSize:12,color:'var(--t3)'}}>{t.wins}승 {t.losses}패</span>
                      <span style={{fontSize:12,fontWeight:700,color:t.diff>0?'var(--green)':t.diff<0?'var(--red)':'var(--t3)'}}>
                        {t.diff>0?'+':''}{t.diff}
                      </span>
                    </div>
                  ))
                }
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
