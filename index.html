<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🏸 민턴매치 프로</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-primary: #060B18;
      --bg-secondary: #0D1526;
      --bg-card: rgba(255,255,255,0.04);
      --bg-card-hover: rgba(255,255,255,0.07);
      --border: rgba(255,255,255,0.08);
      --border-gold: rgba(212,175,55,0.35);
      --gold: #D4AF37;
      --gold-light: #F0D060;
      --gold-dark: #9A7D20;
      --emerald: #10B981;
      --emerald-dark: #059669;
      --text-primary: #F1F5F9;
      --text-secondary: #94A3B8;
      --text-muted: #475569;
      --red: #F87171;
      --blue: #60A5FA;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Pretendard', -apple-system, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
    }
    /* Scrollbar */
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: var(--bg-secondary); }
    ::-webkit-scrollbar-thumb { background: var(--gold-dark); border-radius: 4px; }

    /* Background texture */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse at 20% 0%, rgba(212,175,55,0.06) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 100%, rgba(16,185,129,0.05) 0%, transparent 50%),
        radial-gradient(ellipse at 50% 50%, rgba(6,11,24,0) 0%, rgba(6,11,24,0.8) 100%);
      pointer-events: none;
      z-index: 0;
    }

    /* Glass card */
    .glass {
      background: var(--bg-card);
      border: 1px solid var(--border);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 16px;
      transition: all 0.2s ease;
    }
    .glass:hover { background: var(--bg-card-hover); }
    .glass-gold {
      background: linear-gradient(135deg, rgba(212,175,55,0.1), rgba(212,175,55,0.02));
      border: 1px solid var(--border-gold);
      border-radius: 16px;
    }

    /* Gold gradient text */
    .text-gold {
      background: linear-gradient(135deg, var(--gold-light), var(--gold), var(--gold-dark));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* Animated shimmer */
    @keyframes shimmer {
      0% { background-position: -200% center; }
      100% { background-position: 200% center; }
    }
    .shimmer {
      background: linear-gradient(90deg, var(--gold-dark) 0%, var(--gold-light) 50%, var(--gold-dark) 100%);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: shimmer 3s linear infinite;
    }

    /* Glow button */
    .btn-gold {
      background: linear-gradient(135deg, var(--gold), var(--gold-dark));
      color: #1a1000;
      border: none;
      border-radius: 10px;
      padding: 10px 20px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 16px rgba(212,175,55,0.25);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .btn-gold:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 24px rgba(212,175,55,0.4);
    }
    .btn-gold:active { transform: translateY(0); }
    .btn-gold:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    .btn-emerald {
      background: linear-gradient(135deg, var(--emerald), var(--emerald-dark));
      color: white;
      border: none;
      border-radius: 10px;
      padding: 10px 20px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 16px rgba(16,185,129,0.25);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .btn-emerald:hover { transform: translateY(-1px); box-shadow: 0 8px 24px rgba(16,185,129,0.4); }
    .btn-emerald:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    .btn-ghost {
      background: transparent;
      color: var(--text-secondary);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 20px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .btn-ghost:hover { background: var(--bg-card-hover); color: var(--text-primary); border-color: rgba(255,255,255,0.15); }

    .btn-icon {
      background: transparent;
      border: none;
      cursor: pointer;
      padding: 6px;
      border-radius: 8px;
      color: var(--text-muted);
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
    }
    .btn-icon:hover { background: rgba(255,255,255,0.08); color: var(--red); }

    /* Input styles */
    .input {
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 14px;
      color: var(--text-primary);
      font-size: 14px;
      font-family: inherit;
      transition: all 0.2s ease;
      outline: none;
      width: 100%;
    }
    .input:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(212,175,55,0.12); background: rgba(255,255,255,0.06); }
    .input::placeholder { color: var(--text-muted); }
    input[type=number]::-webkit-inner-spin-button { opacity: 0.4; }

    /* Score input */
    .score-input {
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 4px;
      color: var(--text-primary);
      font-size: 20px;
      font-weight: 700;
      text-align: center;
      width: 60px;
      outline: none;
      transition: all 0.2s;
    }
    .score-input:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(212,175,55,0.12); }

    /* Nav tabs */
    .nav-tab {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 10px 16px;
      border-bottom: 2px solid transparent;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      transition: all 0.2s ease;
      background: transparent;
      border-left: none;
      border-right: none;
      border-top: none;
      font-family: inherit;
    }
    .nav-tab:hover { color: var(--text-primary); }
    .nav-tab.active {
      color: var(--gold);
      border-bottom-color: var(--gold);
    }

    /* Badge */
    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      font-size: 13px;
      font-weight: 800;
    }
    .badge-gold { background: linear-gradient(135deg, #F0D060, #D4AF37); color: #1a1000; box-shadow: 0 2px 12px rgba(212,175,55,0.4); }
    .badge-silver { background: linear-gradient(135deg, #E2E8F0, #94A3B8); color: #0f172a; }
    .badge-bronze { background: linear-gradient(135deg, #FCA97A, #B45309); color: #fff; }
    .badge-default { background: rgba(255,255,255,0.06); color: var(--text-secondary); }

    /* Group pill tabs */
    .group-pill {
      padding: 6px 18px;
      border-radius: 100px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-secondary);
      font-family: inherit;
    }
    .group-pill:hover { color: var(--text-primary); border-color: rgba(255,255,255,0.15); }
    .group-pill.active { background: var(--gold); color: #1a1000; border-color: var(--gold); font-weight: 700; box-shadow: 0 4px 14px rgba(212,175,55,0.3); }

    /* Progress bar */
    .progress-track {
      background: rgba(255,255,255,0.06);
      border-radius: 100px;
      height: 8px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      border-radius: 100px;
      background: linear-gradient(90deg, var(--emerald-dark), var(--emerald), #34D399);
      transition: width 1s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 0 12px rgba(16,185,129,0.4);
    }

    /* Table */
    .data-table { width: 100%; border-collapse: collapse; }
    .data-table th {
      padding: 12px 16px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border);
      text-align: center;
    }
    .data-table td {
      padding: 14px 16px;
      font-size: 14px;
      color: var(--text-secondary);
      border-bottom: 1px solid rgba(255,255,255,0.04);
      text-align: center;
    }
    .data-table tr:hover td { background: rgba(255,255,255,0.02); }
    .data-table tr:last-child td { border-bottom: none; }

    /* Team card in setup */
    .team-card {
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.15s ease;
    }
    .team-card:hover { background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.12); }

    /* Stat card */
    .stat-number {
      font-size: 36px;
      font-weight: 800;
      letter-spacing: -1px;
      line-height: 1;
    }

    /* Match row */
    .match-row {
      display: grid;
      grid-template-columns: 50px 1fr 110px 1fr;
      align-items: center;
      padding: 14px 16px;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      transition: background 0.15s;
    }
    .match-row:hover { background: rgba(255,255,255,0.02); }
    .match-row:last-child { border-bottom: none; }

    /* Check button */
    .check-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 2px solid;
      background: transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      margin: auto;
    }
    .check-btn.played { border-color: var(--emerald); background: rgba(16,185,129,0.15); color: var(--emerald); }
    .check-btn.unplayed { border-color: var(--text-muted); color: transparent; }
    .check-btn.unplayed:hover { border-color: var(--emerald); color: rgba(16,185,129,0.5); }

    /* Divider */
    .divider { border: none; border-top: 1px solid var(--border); margin: 0; }

    /* Loading spinner */
    @keyframes spin { to { transform: rotate(360deg); } }
    .spin { animation: spin 0.8s linear infinite; display: inline-block; }

    /* Fade in */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .fade-up { animation: fadeUp 0.4s ease forwards; }

    /* Notification toast */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(20,30,50,0.95);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      font-weight: 500;
      z-index: 1000;
      backdrop-filter: blur(16px);
      min-width: 280px;
      max-width: 90vw;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }
    .toast.error { border-color: rgba(248,113,113,0.4); }
    .toast.success { border-color: rgba(16,185,129,0.4); }
    .toast.info { border-color: var(--border-gold); }

    @keyframes slideUp {
      from { opacity: 0; transform: translateX(-50%) translateY(20px); }
      to { opacity: 1; transform: translateX(-50%) translateY(0); }
    }
    .toast { animation: slideUp 0.3s ease; }

    /* VS badge */
    .vs-badge {
      font-size: 11px;
      font-weight: 800;
      color: var(--text-muted);
      letter-spacing: 0.05em;
      text-align: center;
    }

    /* Gold dot decoration */
    .gold-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--gold);
      box-shadow: 0 0 8px rgba(212,175,55,0.6);
    }

    /* Header logo glow */
    .logo-glow {
      filter: drop-shadow(0 0 8px rgba(212,175,55,0.5));
    }

    /* Overflow scroll no scrollbar */
    .scroll-x { overflow-x: auto; }
    .scroll-x::-webkit-scrollbar { display: none; }

    /* Ranking highlight row */
    .rank-1 td:first-child { position: relative; }
    .rank-1 td { background: rgba(212,175,55,0.04); }

    /* Section header */
    .section-header {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    /* Responsive */
    @media (max-width: 640px) {
      .stat-number { font-size: 28px; }
      .match-row { grid-template-columns: 40px 1fr 90px 1fr; padding: 12px; }
      .score-input { width: 48px; font-size: 16px; }
    }
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

// ── Icons (inline SVG) ──────────────────────────────────────────────
const Icon = ({ d, size = 20, color = 'currentColor', className = '' }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
    <path d={d} />
  </svg>
);

const Icons = {
  trophy:    "M6 9H4.5a2.5 2.5 0 0 1 0-5H6m12 0h1.5a2.5 2.5 0 0 1 0 5H18M4 1h16v2a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4V1zm4 14a4 4 0 0 0 8 0M12 19v4m-4 0h8",
  users:     "M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2M9 3a4 4 0 1 1 0 8 4 4 0 0 1 0-8zm15 18v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75",
  calendar:  "M8 2v4M16 2v4M3 10h18M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z",
  chart:     "M3 3v18h18M7 16l4-4 4 4 5-5",
  camera:    "M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2zM12 17a4 4 0 1 0 0-8 4 4 0 0 0 0 8z",
  plus:      "M12 5v14M5 12h14",
  trash:     "M3 6h18M19 6l-1 14H6L5 6M10 11v6M14 11v6M9 6V4h6v2",
  check:     "M20 6L9 17l-5-5",
  alert:     "M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0zM12 9v4M12 17h.01",
  loader:    "M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83",
  chevron:   "M9 18l6-6-6-6",
  star:      "M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z",
  medal:     "M12 15a7 7 0 1 0 0-14 7 7 0 0 0 0 14zM8.21 13.89L7 23l5-3 5 3-1.21-9.12",
  shuttle:   "M5 12a7 7 0 0 1 14 0M12 5V3M9 5.5l-.5-2M15 5.5l.5-2M7 7L5.5 5.5M17 7l1.5-1.5M12 21v-9",
  edit:      "M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z",
};

const Ico = ({ name, size = 18, color, className = '' }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color || 'currentColor'} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" className={className} style={{ flexShrink: 0 }}>
    <path d={Icons[name]} />
  </svg>
);

// ── Utilities ───────────────────────────────────────────────────────
const genId = () => Math.random().toString(36).substr(2, 9);

// ── Toast ───────────────────────────────────────────────────────────
function Toast({ msg, type }) {
  if (!msg) return null;
  const colors = { error: '#F87171', success: '#10B981', info: '#D4AF37' };
  const icons = { error: 'alert', success: 'check', info: 'star' };
  return (
    <div className={`toast ${type}`} style={{ color: colors[type] }}>
      <Ico name={icons[type]} size={18} color={colors[type]} />
      <span style={{ color: '#E2E8F0', fontSize: 14 }}>{msg}</span>
    </div>
  );
}

// ── Main App ────────────────────────────────────────────────────────
export default function App() {
  const [tab, setTab] = useState('dashboard');
  const [groups, setGroups] = useState([]);
  const [matches, setMatches] = useState([]);
  const [loading, setLoading] = useState(false);
  const [toast, setToast] = useState(null);

  // Demo data
  useEffect(() => {
    const g1 = genId(), g2 = genId();
    const demoGroups = [
      { id: g1, name: 'A조', teams: [
        { id: genId(), name: '김철수/이영희', age: 85 },
        { id: genId(), name: '박민수/최지연', age: 70 },
        { id: genId(), name: '정대만/송태섭', age: 60 },
      ]},
      { id: g2, name: 'B조', teams: [
        { id: genId(), name: '강동원/한지민', age: 72 },
        { id: genId(), name: '오세훈/박소연', age: 68 },
        { id: genId(), name: '유재석/조세호', age: 90 },
      ]},
    ];
    const demoMatches = [];
    demoGroups.forEach(g => {
      for (let i = 0; i < g.teams.length; i++) {
        for (let j = i + 1; j < g.teams.length; j++) {
          const played = Math.random() > 0.4;
          const s1 = played ? Math.floor(Math.random() * 22) : 0;
          const s2 = played ? Math.floor(Math.random() * 22) : 0;
          demoMatches.push({
            id: genId(), groupId: g.id,
            team1Id: g.teams[i].id, team2Id: g.teams[j].id,
            team1Name: g.teams[i].name, team2Name: g.teams[j].name,
            score1: s1, score2: s2, isPlayed: played
          });
        }
      }
    });
    setGroups(demoGroups);
    setMatches(demoMatches);
  }, []);

  const showToast = (msg, type = 'info') => {
    setToast({ msg, type });
    setTimeout(() => setToast(null), 3500);
  };

  const genMatches = (groupId, teams) => {
    const newM = [];
    for (let i = 0; i < teams.length; i++)
      for (let j = i + 1; j < teams.length; j++)
        newM.push({ id: genId(), groupId, team1Id: teams[i].id, team2Id: teams[j].id,
          team1Name: teams[i].name, team2Name: teams[j].name, score1: 0, score2: 0, isPlayed: false });
    setMatches(prev => [...prev.filter(m => m.groupId !== groupId), ...newM]);
  };

  // Gemini OCR
  const analyzeImage = async (base64, type) => {
    const apiKey = "";
    if (!apiKey) { showToast('API 키가 설정되지 않았습니다. 직접 입력해주세요.', 'error'); return; }
    setLoading(true);
    try {
      const b64 = base64.split(',')[1];
      const prompt = type === 'bracket'
        ? '배드민턴 조별 리그 대진표 이미지입니다. 조 이름과 각 조에 속한 팀명, 팀 합산 나이를 추출해주세요.'
        : '배드민턴 경기 결과 점수판 이미지입니다. 두 팀 이름과 각각의 점수를 추출해주세요.';
      const schema = type === 'bracket'
        ? { type:"OBJECT", properties:{ groups:{ type:"ARRAY", items:{ type:"OBJECT", properties:{ name:{type:"STRING"}, teams:{ type:"ARRAY", items:{ type:"OBJECT", properties:{ name:{type:"STRING"}, age:{type:"NUMBER"} } } } } } } } }
        : { type:"OBJECT", properties:{ matches:{ type:"ARRAY", items:{ type:"OBJECT", properties:{ team1Name:{type:"STRING"}, team2Name:{type:"STRING"}, team1Score:{type:"NUMBER"}, team2Score:{type:"NUMBER"} } } } } };

      const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ contents:[{ role:"user", parts:[{ text:prompt },{ inlineData:{ mimeType:"image/jpeg", data:b64 } }] }], generationConfig:{ responseMimeType:"application/json", responseSchema:schema } })
      });
      const data = await res.json();
      if (data.error) throw new Error(data.error.message);
      const result = JSON.parse(data.candidates[0].content.parts[0].text);

      if (type === 'bracket' && result.groups) {
        const parsed = result.groups.map(g => {
          const gid = genId();
          const teams = (g.teams||[]).map(t => ({ id:genId(), name:t.name, age:t.age||0 }));
          genMatches(gid, teams);
          return { id:gid, name:g.name, teams };
        });
        setGroups(p => [...p, ...parsed]);
        showToast('대진표 인식 완료!', 'success');
      } else if (type === 'score' && result.matches) {
        let cnt = 0;
        setMatches(prev => {
          const nm = [...prev];
          result.matches.forEach(sm => {
            const idx = nm.findIndex(m =>
              (m.team1Name.includes(sm.team1Name)||sm.team1Name.includes(m.team1Name)) &&
              (m.team2Name.includes(sm.team2Name)||sm.team2Name.includes(m.team2Name))
            );
            if (idx !== -1) { nm[idx] = { ...nm[idx], score1:sm.team1Score, score2:sm.team2Score, isPlayed:true }; cnt++; }
          });
          return nm;
        });
        showToast(`${cnt}개 경기 결과 자동 입력!`, 'success');
      }
    } catch(e) {
      showToast('이미지 인식 실패. 직접 입력해주세요.', 'error');
    } finally { setLoading(false); }
  };

  const CameraBtn = ({ type, label }) => {
    const ref = useRef();
    return (
      <>
        <input type="file" accept="image/*" capture="environment" ref={ref} style={{display:'none'}}
          onChange={e => { const f=e.target.files[0]; if(f){const r=new FileReader();r.onloadend=()=>analyzeImage(r.result,type);r.readAsDataURL(f);} }} />
        <button className="btn-gold" onClick={() => ref.current?.click()} disabled={loading}>
          {loading
            ? <Ico name="loader" size={16} className="spin" />
            : <Ico name="camera" size={16} />}
          {label}
        </button>
      </>
    );
  };

  const tabs = [
    { id:'dashboard', icon:'chart',    label:'대시보드' },
    { id:'setup',     icon:'users',    label:'조/대진표' },
    { id:'matches',   icon:'calendar', label:'경기 점수' },
    { id:'rankings',  icon:'trophy',   label:'최종 순위' },
  ];

  return (
    <div style={{ position:'relative', zIndex:1 }}>
      {/* ── Header ── */}
      <header style={{ background:'rgba(6,11,24,0.85)', borderBottom:'1px solid rgba(212,175,55,0.15)', backdropFilter:'blur(20px)', position:'sticky', top:0, zIndex:100 }}>
        <div style={{ maxWidth:1100, margin:'0 auto', padding:'0 20px' }}>
          <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', paddingTop:14, paddingBottom:2 }}>
            <div style={{ display:'flex', alignItems:'center', gap:12 }}>
              <div className="logo-glow" style={{ fontSize:26 }}>🏸</div>
              <div>
                <div className="shimmer" style={{ fontSize:18, fontWeight:800, letterSpacing:'-0.5px' }}>민턴매치 프로</div>
                <div style={{ fontSize:11, color:'var(--text-muted)', marginTop:1, letterSpacing:'0.06em' }}>BADMINTON TOURNAMENT SYSTEM</div>
              </div>
            </div>
            <div style={{ display:'flex', alignItems:'center', gap:8 }}>
              <div className="gold-dot" />
              <span style={{ fontSize:12, color:'var(--gold)', fontWeight:600 }}>LIVE</span>
            </div>
          </div>
          {/* Tabs */}
          <div className="scroll-x" style={{ display:'flex', gap:4, marginTop:4 }}>
            {tabs.map(t => (
              <button key={t.id} className={`nav-tab${tab===t.id?' active':''}`} onClick={() => setTab(t.id)}>
                <Ico name={t.icon} size={14} />
                {t.label}
              </button>
            ))}
          </div>
        </div>
      </header>

      {/* ── Main ── */}
      <main style={{ maxWidth:1100, margin:'0 auto', padding:'28px 20px 60px' }}>
        <div className="fade-up" key={tab}>
          {tab==='dashboard' && <DashboardView groups={groups} matches={matches} setTab={setTab} />}
          {tab==='setup'     && <SetupView groups={groups} setGroups={setGroups} genMatches={genMatches} CameraBtn={CameraBtn} showToast={showToast} />}
          {tab==='matches'   && <MatchesView groups={groups} matches={matches} setMatches={setMatches} CameraBtn={CameraBtn} />}
          {tab==='rankings'  && <RankingsView groups={groups} matches={matches} />}
        </div>
      </main>

      {toast && <Toast msg={toast.msg} type={toast.type} />}
    </div>
  );
}

// ── Ranking helper ──────────────────────────────────────────────────
function calcRank(group, allMatches) {
  const gm = allMatches.filter(m => m.groupId===group.id && m.isPlayed);
  let stats = group.teams.map(t => ({ ...t, played:0, wins:0, losses:0, pf:0, pa:0, diff:0 }));
  gm.forEach(m => {
    const i1=stats.findIndex(t=>t.id===m.team1Id), i2=stats.findIndex(t=>t.id===m.team2Id);
    if(i1<0||i2<0) return;
    stats[i1].played++; stats[i2].played++;
    stats[i1].pf+=m.score1; stats[i1].pa+=m.score2;
    stats[i2].pf+=m.score2; stats[i2].pa+=m.score1;
    if(m.score1>m.score2){ stats[i1].wins++; stats[i2].losses++; }
    else if(m.score2>m.score1){ stats[i2].wins++; stats[i1].losses++; }
  });
  stats.forEach(t=>t.diff=t.pf-t.pa);
  return stats.sort((a,b)=>{
    if(b.diff!==a.diff) return b.diff-a.diff;
    const h2h=gm.find(m=>(m.team1Id===a.id&&m.team2Id===b.id)||(m.team1Id===b.id&&m.team2Id===a.id));
    if(h2h){ const as=h2h.team1Id===a.id?h2h.score1:h2h.score2, bs=h2h.team1Id===b.id?h2h.score1:h2h.score2; if(as!==bs) return bs-as; }
    return b.age-a.age;
  });
}

          { label:'참가 조', value:groups.length, sub:'개 조', icon:'users', color:'#D4AF37' },
          { label:'참가 팀', value:totalTeams, sub:'팀', icon:'medal', color:'#10B981' },
          { label:'전체 경기', value:total, sub:'경기', icon:'calendar', color:'#60A5FA' },
          { label:'진행 완료', value:played, sub:`/ ${total}경기`, icon:'check', color:'#A78BFA' },

            <div style={{ display:'flex', justifyContent:'space-between', alignItems:'flex-start', marginBottom:12 }}>
              <span style={{ fontSize:12, fontWeight:600, color:'var(--text-muted)', letterSpacing:'0.05em', textTransform:'uppercase' }}>{c.label}</span>
              <Ico name={c.icon} size={18} color={c.color} />
            </div>
            <div className="stat-number" style={{ color: c.color }}>{c.value}</div>
            <div style={{ fontSize:13, color:'var(--text-muted)', marginTop:4 }}>{c.sub}</div>
          </div>
        ))}
      </div>

      {/* Progress */}
      <div className="glass" style={{ padding:'24px 28px' }}>
        <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:16 }}>
          <div>
            <div style={{ fontSize:14, fontWeight:700, marginBottom:4 }}>대회 진행률</div>
            <div style={{ fontSize:12, color:'var(--text-muted)' }}>{played}경기 완료 · {total-played}경기 남음</div>
          </div>
          <div style={{ fontSize:32, fontWeight:800, color:'var(--emerald)' }}>{pct}<span style={{ fontSize:16, fontWeight:600 }}>%</span></div>
        </div>
        <div className="progress-track">
          <div className="progress-fill" style={{ width:`${pct}%` }} />
        </div>
      </div>

      {/* Group leaders */}
      <div className="glass" style={{ padding:'24px 28px' }}>
        <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:20 }}>
          <div style={{ display:'flex', alignItems:'center', gap:10 }}>
            <Ico name="trophy" size={20} color="var(--gold)" />
            <span style={{ fontSize:16, fontWeight:700 }}>현재 조별 선두팀</span>
          </div>
          <button className="btn-ghost" style={{ fontSize:12, padding:'6px 14px' }} onClick={()=>setTab('rankings')}>
            전체 순위 <Ico name="chevron" size={14} />
          </button>
        </div>
        <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fill,minmax(220px,1fr))', gap:12 }}>
          {groups.length===0 ? (
            <div style={{ color:'var(--text-muted)', fontSize:14, padding:'20px 0', gridColumn:'1/-1', textAlign:'center' }}>
              조를 추가하면 선두팀이 여기 표시됩니다.
            </div>
          ) : groups.map(g => {

            const leader = rank[0];
            return (

                <div style={{ fontSize:11, fontWeight:700, color:'var(--gold)', letterSpacing:'0.1em', marginBottom:8 }}>{g.name}</div>

                      <span style={{ fontSize:12, color:'var(--text-muted)' }}>패 <b style={{ color:'#F87171' }}>{leader.losses}</b></span>

// 2. SETUP
// ════════════════════════════════════════════════════════════════════
function SetupView({ groups, setGroups, genMatches, CameraBtn, showToast }) {
  const [selId, setSelId] = useState(null);
  const [newGroup, setNewGroup] = useState('');
  const [newTeam, setNewTeam] = useState('');
  const [newAge, setNewAge] = useState('');

  useEffect(() => { if(!selId && groups.length>0) setSelId(groups[0].id); }, [groups]);

  const addGroup = () => {
    if(!newGroup.trim()) return;
    const ng = { id:genId(), name:newGroup.trim(), teams:[] };
    setGroups(p=>[...p,ng]); setSelId(ng.id); setNewGroup('');
  };

  const delGroup = (id) => {
    if(!window.confirm('조를 삭제하시겠습니까? 관련 경기도 모두 삭제됩니다.')) return;
    setGroups(p=>p.filter(g=>g.id!==id));
    if(selId===id) setSelId(null);
  };

  const addTeam = () => {
    if(!newTeam.trim()||!selId) return;
    setGroups(prev => prev.map(g => {
      if(g.id!==selId) return g;
      if(g.teams.length>=6){ showToast('최대 6팀까지만 편성 가능합니다.','error'); return g; }
      const teams=[...g.teams,{id:genId(),name:newTeam.trim(),age:Number(newAge)||0}];
      genMatches(g.id,teams);
      return {...g,teams};
    }));
    setNewTeam(''); setNewAge('');
  };

  const delTeam = (gId, tId) => {
    if(!window.confirm('팀을 삭제하시겠습니까?')) return;
    setGroups(prev=>prev.map(g=>{
      if(g.id!==gId) return g;
      const teams=g.teams.filter(t=>t.id!==tId);
      genMatches(g.id,teams);
      return {...g,teams};
    }));
  };

  const sel = groups.find(g=>g.id===selId);

  return (
    <div style={{ display:'flex', flexDirection:'column', gap:20 }}>
      {/* Header action */}
      <div className="glass-gold" style={{ padding:'20px 24px', display:'flex', flexWrap:'wrap', justifyContent:'space-between', alignItems:'center', gap:12 }}>
        <div>
          <div style={{ fontSize:16, fontWeight:700, marginBottom:4 }}>대진표 자동 인식</div>
          <div style={{ fontSize:13, color:'var(--text-muted)' }}>사진을 찍으면 AI가 조와 팀을 자동으로 추출합니다</div>
        </div>
        <CameraBtn type="bracket" label="대진표 사진 인식" />
      </div>

      <div style={{ display:'grid', gridTemplateColumns:'200px 1fr', gap:16 }}>
        {/* Group list */}
        <div className="glass" style={{ padding:16 }}>
          <div className="section-header">조 목록</div>
          <div style={{ display:'flex', flexDirection:'column', gap:8, marginBottom:12 }}>
            {groups.length===0
              ? <div style={{ fontSize:13, color:'var(--text-muted)', textAlign:'center', padding:'16px 0' }}>조 없음</div>
              : groups.map(g=>(
                <div key={g.id}
                  onClick={()=>setSelId(g.id)}
                  style={{
                    padding:'10px 12px', borderRadius:10, cursor:'pointer',
                    background: selId===g.id ? 'rgba(212,175,55,0.12)' : 'rgba(255,255,255,0.03)',
                    border: `1px solid ${selId===g.id?'rgba(212,175,55,0.4)':'rgba(255,255,255,0.06)'}`,
                    display:'flex', justifyContent:'space-between', alignItems:'center',
                    transition:'all 0.15s'
                  }}>
                  <span style={{ fontSize:14, fontWeight:600, color: selId===g.id?'var(--gold)':'var(--text-secondary)' }}>
                    {g.name} <span style={{ fontSize:12, color:'var(--text-muted)' }}>({g.teams.length})</span>
                  </span>
                  <button className="btn-icon" onClick={e=>{e.stopPropagation();delGroup(g.id);}}>
                    <Ico name="trash" size={14} />
                  </button>
                </div>
              ))}
          </div>
          <div style={{ display:'flex', gap:6 }}>
            <input className="input" style={{ fontSize:13, padding:'8px 10px' }} placeholder="새 조 이름"
              value={newGroup} onChange={e=>setNewGroup(e.target.value)} onKeyDown={e=>e.key==='Enter'&&addGroup()} />
            <button className="btn-gold" style={{ padding:'8px 12px', flexShrink:0 }} onClick={addGroup}>
              <Ico name="plus" size={16} />
            </button>
          </div>
        </div>

        {/* Team detail */}
        <div className="glass" style={{ padding:24 }}>
          {!sel ? (
            <div style={{ display:'flex', alignItems:'center', justifyContent:'center', height:'100%', color:'var(--text-muted)', fontSize:14, padding:'40px 0' }}>
              ← 좌측에서 조를 선택하거나 새로 만드세요
            </div>
          ) : (
            <>
              <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:20 }}>
                <div>
                  <div style={{ fontSize:18, fontWeight:800 }}>{sel.name}</div>
                  <div style={{ fontSize:13, color:'var(--text-muted)', marginTop:2 }}>참가 팀 관리 · 최대 6팀</div>
                </div>
                <div style={{ fontSize:28, fontWeight:800, color:'var(--gold)' }}>{sel.teams.length}<span style={{ fontSize:14, color:'var(--text-muted)', fontWeight:400 }}>/6</span></div>
              </div>

              <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fill,minmax(180px,1fr))', gap:10, marginBottom:24 }}>
                {sel.teams.map(t=>(
                  <div key={t.id} className="team-card">
                    <div>
                      <div style={{ fontSize:14, fontWeight:700 }}>{t.name}</div>
                      <div style={{ fontSize:12, color:'var(--text-muted)', marginTop:2 }}>합산 나이 {t.age}</div>
                    </div>
                    <button className="btn-icon" onClick={()=>delTeam(sel.id,t.id)}>
                      <Ico name="trash" size={14} />
                    </button>
                  </div>
                ))}
              </div>

              <hr className="divider" style={{ marginBottom:20 }} />
              <div className="section-header">팀 수동 추가</div>
              <div style={{ display:'flex', flexWrap:'wrap', gap:10 }}>
                <input className="input" style={{ flex:'2 1 200px' }} placeholder="팀명 (예: 김철수/이영희)"
                  value={newTeam} onChange={e=>setNewTeam(e.target.value)} onKeyDown={e=>e.key==='Enter'&&addTeam()} />
                <input className="input" type="number" style={{ flex:'1 1 120px' }} placeholder="합산 나이"
                  value={newAge} onChange={e=>setNewAge(e.target.value)} onKeyDown={e=>e.key==='Enter'&&addTeam()} />
                <button className="btn-emerald" style={{ flexShrink:0 }} onClick={addTeam}>
                  <Ico name="plus" size={16} /> 팀 추가
                </button>
              </div>
            </>
          )}
        </div>
      </div>
    </div>
  );
}

// 3. MATCHES
// ════════════════════════════════════════════════════════════════════
function MatchesView({ groups, matches, setMatches, CameraBtn }) {
  const [selId, setSelId] = useState(groups[0]?.id||null);
  useEffect(()=>{ if(!selId&&groups.length>0) setSelId(groups[0].id); },[groups]);

  const groupMatches = matches.filter(m=>m.groupId===selId);

  const updateScore = (id, field, val) =>
    setMatches(p=>p.map(m=>m.id===id?{...m,[field]:val===''?0:parseInt(val)||0,isPlayed:true}:m));

  const toggle = (id) =>
    setMatches(p=>p.map(m=>m.id===id?{...m,isPlayed:!m.isPlayed}:m));

  return (
    <div style={{ display:'flex', flexDirection:'column', gap:20 }}>
      {/* Header */}
      <div className="glass-gold" style={{ padding:'20px 24px', display:'flex', flexWrap:'wrap', justifyContent:'space-between', alignItems:'center', gap:12 }}>
        <div>
          <div style={{ fontSize:16, fontWeight:700, marginBottom:4 }}>경기 결과 입력</div>
          <div style={{ fontSize:13, color:'var(--text-muted)' }}>점수판을 촬영하면 AI가 자동으로 점수를 입력합니다</div>
        </div>
        <CameraBtn type="score" label="점수표 사진 인식" />
      </div>

      {/* Group tabs */}
      <div className="scroll-x" style={{ display:'flex', gap:8 }}>
        {groups.map(g=>(
          <button key={g.id} className={`group-pill${selId===g.id?' active':''}`} onClick={()=>setSelId(g.id)}>
            {g.name}
          </button>
        ))}
      </div>

      {/* Matches */}
      <div className="glass" style={{ overflow:'hidden' }}>
        {groups.length===0 ? (
          <div style={{ padding:40, textAlign:'center', color:'var(--text-muted)' }}>등록된 조가 없습니다.</div>
        ) : groupMatches.length===0 ? (
          <div style={{ padding:40, textAlign:'center', color:'var(--text-muted)' }}>생성된 경기가 없습니다.</div>
        ) : (
          <>
            {/* Header row */}
            <div style={{ display:'grid', gridTemplateColumns:'50px 1fr 110px 1fr', padding:'10px 16px', borderBottom:'1px solid var(--border)' }}>
              <div style={{ fontSize:11, fontWeight:700, color:'var(--text-muted)', textTransform:'uppercase', letterSpacing:'0.08em', textAlign:'center' }}>상태</div>
              <div style={{ fontSize:11, fontWeight:700, color:'var(--text-muted)', textTransform:'uppercase', letterSpacing:'0.08em', textAlign:'right' }}>팀 A</div>
              <div style={{ fontSize:11, fontWeight:700, color:'var(--text-muted)', textTransform:'uppercase', letterSpacing:'0.08em', textAlign:'center' }}>스코어</div>
              <div style={{ fontSize:11, fontWeight:700, color:'var(--text-muted)', textTransform:'uppercase', letterSpacing:'0.08em', textAlign:'left' }}>팀 B</div>
            </div>

            {groupMatches.map(m => {
              const w1 = m.isPlayed && m.score1>m.score2;
              const w2 = m.isPlayed && m.score2>m.score1;
              return (
                <div key={m.id} className="match-row">
                  {/* Status */}
                  <button className={`check-btn ${m.isPlayed?'played':'unplayed'}`} onClick={()=>toggle(m.id)}>
                    {m.isPlayed && <Ico name="check" size={14} color="var(--emerald)" />}
                  </button>
                  {/* Team 1 */}
                  <div style={{ textAlign:'right', paddingRight:10 }}>
                    <span style={{ fontSize:14, fontWeight: w1?700:500, color: w1?'var(--text-primary)':'var(--text-secondary)' }}>
                      {m.team1Name}
                    </span>
                    {w1 && <span style={{ marginLeft:6, fontSize:11, color:'var(--gold)', fontWeight:700 }}>WIN</span>}
                  </div>
                  {/* Score */}
                  <div style={{ display:'flex', alignItems:'center', justifyContent:'center', gap:6 }}>
                    <input className="score-input" type="number" min="0" value={m.score1}
                      onChange={e=>updateScore(m.id,'score1',e.target.value)}
                      style={{ color: w1?'var(--gold)':w2?'var(--text-muted)':'var(--text-primary)' }} />
                    <span className="vs-badge">VS</span>
                    <input className="score-input" type="number" min="0" value={m.score2}
                      onChange={e=>updateScore(m.id,'score2',e.target.value)}
                      style={{ color: w2?'var(--gold)':w1?'var(--text-muted)':'var(--text-primary)' }} />
                  </div>
                  {/* Team 2 */}
                  <div style={{ textAlign:'left', paddingLeft:10 }}>
                    {w2 && <span style={{ marginRight:6, fontSize:11, color:'var(--gold)', fontWeight:700 }}>WIN</span>}
                    <span style={{ fontSize:14, fontWeight: w2?700:500, color: w2?'var(--text-primary)':'var(--text-secondary)' }}>
                      {m.team2Name}
                    </span>
                  </div>
                </div>
              );
            })}
          </>
        )}
      </div>
    </div>
  );
}

// 4. RANKINGS
// ════════════════════════════════════════════════════════════════════
function RankingsView({ groups, matches }) {
  const [selId, setSelId] = useState(groups[0]?.id||null);
  useEffect(()=>{ if(!selId&&groups.length>0) setSelId(groups[0].id); },[groups]);

  const group = groups.find(g=>g.id===selId);
  const rank = group ? calcRank(group, matches) : [];

  const medalBadge = (i) => {
    if(i===0) return <span className="badge badge-gold">1</span>;
    if(i===1) return <span className="badge badge-silver">2</span>;
    if(i===2) return <span className="badge badge-bronze">3</span>;
    return <span className="badge badge-default" style={{ width:28,height:28,fontSize:12 }}>{i+1}</span>;
  };

  return (
    <div style={{ display:'flex', flexDirection:'column', gap:20 }}>
      {/* Header */}
      <div style={{
        background:'linear-gradient(135deg, rgba(212,175,55,0.15), rgba(212,175,55,0.04))',
        border:'1px solid rgba(212,175,55,0.25)',
        borderRadius:16, padding:'24px 28px'
      }}>
        <div style={{ display:'flex', alignItems:'center', gap:12, marginBottom:8 }}>
          <Ico name="trophy" size={24} color="var(--gold)" />
          <div className="shimmer" style={{ fontSize:22, fontWeight:800 }}>최종 조별 순위</div>
        </div>
        <div style={{ fontSize:13, color:'var(--text-muted)' }}>
          순위 산정 기준: <span style={{ color:'var(--gold)' }}>득실차</span> → <span style={{ color:'#60A5FA' }}>승자승</span> → <span style={{ color:'#A78BFA' }}>연장자(합산나이)</span>
        </div>
      </div>

      {/* Group tabs */}
      <div className="scroll-x" style={{ display:'flex', gap:8 }}>
        {groups.map(g=>(
          <button key={g.id} className={`group-pill${selId===g.id?' active':''}`} onClick={()=>setSelId(g.id)}>
            {g.name}
          </button>
        ))}
      </div>

      {/* Top 3 podium (if enough teams) */}
      {rank.length>=3 && (
        <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr 1fr', gap:12 }}>
          {[rank[1], rank[0], rank[2]].map((t, pos) => {
            const actualPos = pos===0?2:pos===1?1:3;
            const height = ['60px','80px','50px'][pos];
            const colors = {
              1: { bg:'rgba(212,175,55,0.12)', border:'rgba(212,175,55,0.35)', label:'var(--gold)' },
              2: { bg:'rgba(148,163,184,0.08)', border:'rgba(148,163,184,0.2)', label:'#94A3B8' },
              3: { bg:'rgba(180,83,9,0.08)', border:'rgba(180,83,9,0.2)', label:'#F97316' },
            };
            const c = colors[actualPos];
            if(!t) return <div key={pos} />;
            return (
              <div key={t.id} style={{ background:c.bg, border:`1px solid ${c.border}`, borderRadius:16, padding:'20px 16px', textAlign:'center', display:'flex', flexDirection:'column', alignItems:'center', gap:8 }}>
                {medalBadge(actualPos-1)}
                <div style={{ fontSize:14, fontWeight:700, color:'var(--text-primary)', marginTop:4 }}>{t.name}</div>
                <div style={{ fontSize:13, color:c.label, fontWeight:600 }}>
                  {t.diff>0?`+${t.diff}`:t.diff} 득실
                </div>
                <div style={{ fontSize:12, color:'var(--text-muted)' }}>{t.wins}승 {t.losses}패</div>
                <div style={{ height, background:c.border.replace('0.35','0.2').replace('0.2','0.2'), borderRadius:4, width:40, marginTop:8, alignSelf:'center' }} />
              </div>
            );
          })}
        </div>
      )}

      {/* Full table */}
      <div className="glass" style={{ overflow:'hidden' }}>
        {!group ? (
          <div style={{ padding:40, textAlign:'center', color:'var(--text-muted)' }}>등록된 조가 없습니다.</div>
        ) : (
          <div style={{ overflowX:'auto' }}>
            <table className="data-table">
              <thead>
                <tr>
                  <th style={{ width:60 }}>순위</th>
                  <th style={{ textAlign:'left', paddingLeft:20 }}>팀명</th>
                  <th>경기수</th>
                  <th style={{ color:'#60A5FA' }}>승</th>
                  <th style={{ color:'#F87171' }}>패</th>
                  <th>득점</th>
                  <th>실점</th>
                  <th style={{ color:'var(--emerald)' }}>득실차</th>
                  <th>연령</th>
                </tr>
              </thead>
              <tbody>
                {rank.map((t,i)=>(
                  <tr key={t.id} style={{ background: i===0?'rgba(212,175,55,0.04)':'' }}>
                    <td>{medalBadge(i)}</td>
                    <td style={{ textAlign:'left', paddingLeft:20, fontWeight:700, color:'var(--text-primary)', fontSize:14 }}>{t.name}</td>
                    <td>{t.played}</td>
                    <td style={{ color:'#60A5FA', fontWeight:700 }}>{t.wins}</td>
                    <td style={{ color:'#F87171', fontWeight:700 }}>{t.losses}</td>
                    <td style={{ color:'var(--text-primary)' }}>{t.pf}</td>
                    <td>{t.pa}</td>
                    <td style={{ fontWeight:800, fontSize:15, color: t.diff>0?'var(--emerald)':t.diff<0?'#F87171':'var(--text-muted)' }}>
                      {t.diff>0?`+${t.diff}`:t.diff}
                    </td>
                    <td style={{ fontSize:12, color:'var(--text-muted)' }}>{t.age}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}
      </div>
    </div>
  );
}

// ── Mount ──────────────────────────────────────────────────────────
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
